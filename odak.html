  setInterval(() => { if (!document.hidden) { syncNow(); paintSync(); } }, 30000);


  // ── Pomodoro ──
  // Varsayılan: 50 dk çalışma, 10 dk mola, 3 turdan sonra 25 dk uzun mola. Ayarlardan değişir.
  const pomo = state.pomo;
  const SETS = [
    ["work",   "Çalışma (dk)",   5, 120, 5],
    ["short",  "Mola (dk)",      1,  30, 1],
    ["long",   "Uzun mola (dk)", 5,  60, 5],
    ["rounds", "Tur sayısı",     1,   8, 1],
    ["alarm",  "Alarm süresi (sn)", 3, 60, 3],
    ["vol",    "Alarm sesi (%)", 10, 100, 10],
    ["intent", "Tur başında niyet sor", 0, 1, 1],
    ["reflect","Mola başında not sor", 0, 1, 1],
    ["goalH",  "Haftalık hedef (saat)", 0, 40, 1],
    ["goalV",  "Haftalık hedef (video)", 0, 60, 1]
  ];
  const pomoBtn = $("pomo"), pomoTime = $("pomoTime"), pomoRound = $("pomoRound");
  const restEl = $("rest"), pop = $("pop");

  let mode = "work";       // "work" | "short" | "long"
  let running = false;
  let done = 0;            // bu turda biten çalışma sayısı
  let endAt = 0, tick = null;
  const dur = (m) => (m === "work" ? pomo.work : m === "short" ? pomo.short : pomo.long) * 60000;
  let remain = dur("work");

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  let actx = null;
  function audioInit() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (_) {}
  }
  // Alarm: üç notalı çan sesi, ayarlardaki süre boyunca tekrarlanır.
  // Sayfada herhangi bir yere tıklayınca ya da tuşa basınca susar.
  let alarmTimer = null, alarmGain = null;

  // iPhone'da WebAudio, sessiz anahtarı açıkken susar; alarm çalarken oturumu "playback"e alıp sonra eski haline döndürür
  function audioSession(type) { try { if (navigator.audioSession && navigator.audioSession.type !== type) navigator.audioSession.type = type; } catch (_) {} }
  function alarmStop() {
    clearInterval(alarmTimer);
    alarmTimer = null;
    audioSession("auto");
    if (alarmGain && actx) { try { alarmGain.gain.setTargetAtTime(0, actx.currentTime, 0.04); } catch (_) {} }
    alarmGain = null;
  }
  // Çan: temel ses + iki üst ton, yavaşça sönen zarf
  function chime(dest, t0, freq) {
    [[1, 1], [2.01, 0.35], [3.02, 0.15]].forEach(([m, amp]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine";
      o.frequency.value = freq * m;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3 * amp, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
      o.connect(g); g.connect(dest);
      o.start(t0); o.stop(t0 + 1.9);
    });
  }
  function alarmPattern() {
    if (!alarmGain) return;
    const t = actx.currentTime + 0.05;
    [659.25, 880, 1108.73].forEach((f, i) => chime(alarmGain, t + i * 0.4, f));
  }
  function alarmStart(seconds) {
    alarmStop();
    audioSession("playback");
    audioInit();
    if (!actx) return;
    const g = actx.createGain();
    g.gain.value = Math.max(0.05, Math.min(1, pomo.vol / 100));
    g.connect(actx.destination);
    alarmGain = g;
    const end = Date.now() + (seconds || pomo.alarm) * 1000;
    const begin = () => {
      if (alarmGain !== g) return;            // bu arada susturuldu ya da yenisi başladı
      alarmPattern();
      alarmTimer = setInterval(() => {
        if (Date.now() >= end) alarmStop(); else alarmPattern();
      }, 2800);
    };
    if (actx.state === "running") begin(); else actx.resume().then(begin).catch(() => {});
  }

  function askNotify() {
    try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (_) {}
  }
  function notifyPhase(wasWork) {
    try {
      if (document.hidden && "Notification" in window && Notification.permission === "granted") {
        new Notification(wasWork ? "Çalışma bitti" : "Mola bitti", {
          body: wasWork ? "Mola başladı. Ekrandan biraz uzaklaş." : "Hazır olunca devam et.",
          silent: true
        });
      }
    } catch (_) {}
  }

  function paintPomo() {
    const t = fmt(remain);
    const inBreak = mode !== "work";
    pomoTime.textContent = t;
    pomoBtn.classList.toggle("active", running && !inBreak);
    const round = mode === "work" ? done + 1 : (mode === "long" ? pomo.rounds : done);
    pomoRound.textContent = round + "/" + pomo.rounds;
    restEl.hidden = !inBreak;
    if (!inBreak && pendingReflect) hideReflect();
    $("restTime").textContent = t;
    $("restLbl").textContent = mode === "long" ? "UZUN MOLA" : "MOLA";
    document.title = running ? t + " · Odak" : "Odak";
  }

  function run() {
    running = true;
    endAt = Date.now() + remain;
    clearInterval(tick);
    tick = setInterval(pomoTick, 250);
  }
  function halt() {
    if (running) remain = Math.max(0, endAt - Date.now());
    running = false;
    clearInterval(tick);
  }

  function pomoTick() {
    remain = endAt - Date.now();
    if (remain <= 0) phaseEnd(); else paintPomo();
  }

  function phaseEnd() {
    halt();
    const wasWork = mode === "work";
    alarmStart();
    if (mode === "work") {
      done++;
      const k = dayKey();
      bump("pomos", k, 1);
      const entry = { ts: Date.now(), pid: pid(), intent: currentIntent, learned: "", min: pomo.work };
      state.log.push(entry);
      if (state.log.length > 200) state.log.splice(0, state.log.length - 200);
      currentIntent = "";
      if (pomo.reflect) showReflect(entry);
      if (ready) { saveProgress(); yt.pauseVideo(); }   // mola başlayınca video durur
      saveState();
      refreshPanels();
      mode = done >= pomo.rounds ? "long" : "short";
      if (mode === "long") done = 0;
      remain = dur(mode);
      run();                                             // mola kendiliğinden başlar
    } else {
      mode = "work";                                     // yeni çalışma, sen başlatınca başlar
      remain = dur("work");
    }
    notifyPhase(wasWork);
    paintPomo();
  }

  function pomoStart() {
    run();
    if (mode === "work" && ready) { try { yt.playVideo(); } catch (_) {} }
    paintPomo();
  }

  function pomoToggle() {
    audioInit();
    alarmStop();
    askNotify();
    if (running) {
      halt();
      if (mode === "work" && ready) yt.pauseVideo();
      paintPomo();
    } else {
      askIntent(pomoStart);              // yeni tur başlıyorsa önce niyeti sorar
    }
  }

  function pomoSkipBreak() {
    alarmStop();
    hideReflect();
    if (mode === "work") return;
    halt();
    mode = "work";
    remain = dur("work");
    paintPomo();
  }

  function pomoReset() {
    halt();
    hideReflect();
    mode = "work";
    done = 0;
    remain = dur("work");
    paintPomo();
  }

  const TOGGLES = { intent: 1, reflect: 1 };
  const setText = (key) => TOGGLES[key] ? (pomo[key] ? "açık" : "kapalı") : (/^goal/.test(key) && !pomo[key] ? "kapalı" : String(pomo[key]));


  // ── Görünüm: koyu (varsayılan) ya da kağıt (sepya). Cihaza özeldir, eşitlenmez. ──
  function themeNow() { return document.documentElement.getAttribute("data-theme") === "paper" ? "paper" : "dark"; }
  function setTheme(t) {
    if (t === "paper") document.documentElement.setAttribute("data-theme", "paper");
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("odak.theme", t); } catch (_) {}
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "paper" ? "#f4ecd8" : "#000000");
  }

  // ── Dışa aktarma: not dökümü, ilerleme raporu, yedek ──
  const trDate = (ms) => new Date(ms).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  const ytLink = (id, t) => "https://www.youtube.com/watch?v=" + id + (t ? "&t=" + Math.floor(t) + "s" : "");
  const courseIndexOf = (key) => courses.findIndex((c) => cleanId(c.playlistId) === key);

  function countNotes() {
    let n = 0;
    Object.keys(state.notes).forEach((k) => Object.keys(state.notes[k]).forEach((id) => { n += (state.notes[k][id] || []).length; }));
    return n;
  }
  // Notlar: kurs › video başına, saniyeye bağlı YouTube bağlantısıyla (tıklayınca o ana gider)
  function buildNotesMd() {
    const body = [];
    let total = 0;
    courses.forEach((c, i) => {
      const key = pidOf(i), byVideo = state.notes[key];
      if (!byVideo) return;
      const order = lists[key] || [];
      const vids = Object.keys(byVideo).filter((id) => (byVideo[id] || []).length);
      if (!vids.length) return;
      vids.sort((x, y) => { const a = order.indexOf(x), b = order.indexOf(y); return (a < 0 ? 1e9 : a) - (b < 0 ? 1e9 : b); });
      body.push("## " + c.name + " (" + c.group + ")", "");
      vids.forEach((id) => {
        const k = order.indexOf(id);
        body.push("### " + (k >= 0 ? (k + 1) + ". " : "") + titleOf(key, id), "");
        byVideo[id].slice().sort((a, b) => a.t - b.t).forEach((n) => {
          body.push("- [" + fmtClock(n.t) + "](" + ytLink(id, n.t) + ") " + String(n.text).replace(/\s*\n\s*/g, " "));
          total++;
        });
        body.push("");
      });
    });
    const head = ["# Odak: Notlarım", "", trDate(Date.now()) + " tarihinde dışa aktarıldı. Toplam " + total + " not. Saniyelere tıklayınca video o anda açılır.", ""];
    return head.concat(body).join("\n").replace(/\n+$/, "") + "\n";
  }
  // İlerleme raporu: özet, kurs kurs durum, son 14 gün, oturum günlüğü
  function buildReportMd() {
    const L = [];
    const now = new Date();
    const sumDays = (n) => { let s = 0; for (let k = 0; k < n; k++) s += state.time[dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - k))] || 0; return s; };
    const allSec = Object.keys(state.time).reduce((a, k) => a + (state.time[k] || 0), 0);
    const pomoAll = Object.keys(state.pomos).reduce((a, k) => a + (state.pomos[k] || 0), 0);
    let doneAll = 0, appliedAll = 0;
    courses.forEach((c, i) => { const k = pidOf(i); doneAll += Object.keys(state.done[k] || {}).length; appliedAll += Object.keys(state.applied[k] || {}).length; });
    L.push("# Odak: İlerleme raporu", "", trDate(now.getTime()) + " tarihinde dışa aktarıldı.", "");
    L.push("## Özet", "");
    L.push("- Toplam izleme: " + fmtDur(allSec));
    L.push("- Son 7 gün: " + fmtDur(sumDays(7)) + " · son 30 gün: " + fmtDur(sumDays(30)));
    L.push("- Seri: " + streak() + " gün (günde en az " + Math.round(STREAK_MIN / 60) + " dk)");
    L.push("- Tamamlanan pomodoro: " + pomoAll);
    L.push("- Biten video: " + doneAll + " · uyguladığım: " + appliedAll, "");

    L.push("## Kurslar", "");
    const idle = [];
    let lastGroup = "";
    courses.forEach((c, i) => {
      const k = pidOf(i), d = Object.keys(state.done[k] || {}).length, ap = Object.keys(state.applied[k] || {}).length, w = state.watch[k] || 0;
      if (!d && !ap && !w) { idle.push(c.name); return; }
      if (c.group !== lastGroup) { L.push("### " + c.group, ""); lastGroup = c.group; }
      const total = totalOf(i), p = state.progress[k];
      let line = "- **" + c.name + "**: " + d + (total ? " / " + total + " video (%" + Math.round(100 * d / total) + ")" : " video");
      if (ap) line += " · uyguladığım " + ap;
      if (w) line += " · izleme " + fmtDur(w);
      if (p && p.index != null) line += " · kaldığım yer " + (p.index + 1) + ". video " + fmtClock(p.time || 0);
      L.push(line);
    });
    if (idle.length) L.push("", "Henüz başlanmayan: " + idle.join(", ") + ".");
    L.push("");

    L.push("## Son 14 gün", "");
    let any14 = false;
    for (let k = 0; k < 14; k++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - k), key = dayKey(d);
      const s = state.time[key] || 0, pm = state.pomos[key] || 0;
      if (!s && !pm) continue;
      any14 = true;
      L.push("- " + trDate(d.getTime()) + ": " + fmtDur(s) + (pm ? " · " + pm + " pomodoro" : ""));
    }
    if (!any14) L.push("Kayıtlı çalışma yok.");
    L.push("");

    const logs = state.log.slice(-30).reverse();
    if (logs.length) {
      L.push("## Oturum günlüğü (son " + logs.length + ")", "");
      logs.forEach((e) => {
        const i = courseIndexOf(e.pid), name = i >= 0 ? courses[i].name : "Kurs";
        let line = "- " + trDate(e.ts) + " · " + name + " · " + (e.min || 0) + " dk";
        if (e.intent) line += "\n  - Hedef: " + e.intent;
        if (e.learned) line += "\n  - Öğrendim: " + e.learned;
        L.push(line);
      });
      L.push("");
    }
    return L.join("\n").replace(/\n+$/, "") + "\n";
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (_) { return false; }
  }
  // Telefonda paylaşım sayfası (Dosyalar'a kaydet, AirDrop...), bilgisayarda doğrudan indirme
  async function saveFile(name, text, type) {
    try {
      if (matchMedia("(pointer: coarse)").matches && navigator.canShare && typeof File === "function") {
        const f = new File([text], name, { type: "text/plain" });
        if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }
  async function doExport(kind, how) {
    const stamp = dayKey();
    let text, name, type = "text/markdown", label;
    if (kind === "notes") {
      if (!countNotes()) { flash("Henüz not yok."); return; }
      text = buildNotesMd(); name = "odak-notlar-" + stamp + ".md"; label = "Notlar";
    } else if (kind === "report") {
      text = buildReportMd(); name = "odak-ilerleme-" + stamp + ".md"; label = "Rapor";
    } else {
      text = JSON.stringify(state); name = "odak-yedek-" + stamp + ".json"; type = "application/json"; label = "Yedek";
    }
    if (how === "copy") { flash((await copyText(text)) ? label + " kopyalandı." : "Kopyalanamadı; İndir'i dene."); return; }
    await saveFile(name, text, type);
    flash(label + " hazır: " + name);
  }
  // Yedeği yüklemek mevcut kaydın üzerine yazmaz, birleştirir (yeni olan kazanır, hiçbir şey silinmez)
  function importBackup() {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = ".json,application/json";
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        if (!isObj(data) || !(data.progress || data.done || data.ctr || data.notes)) throw new Error("bu bir Odak yedeği değil");
        adopt(mergeStates(state, data));
        saveState();
        syncNow(true);
        flash("Yedek mevcut kayıtla birleştirildi.");
      } catch (e) { flash("Yedek okunamadı: " + ((e && e.message) || "hata")); }
    });
    inp.click();
  }

  function popRow(label, buttons) {
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = label;
    row.appendChild(name);
    buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = b[0];
      if (b[2]) btn.classList.add("active");
      btn.addEventListener("click", b[1]);
      row.appendChild(btn);
    });
    pop.appendChild(row);
    return row;
  }
  function renderTheme() {
    const t = themeNow();
    popRow("Görünüm", [
      ["Koyu", () => { setTheme("dark"); renderPop(); }, t === "dark"],
      ["Kağıt", () => { setTheme("paper"); renderPop(); }, t === "paper"]
    ]);
  }
  function renderExport() {
    const share = matchMedia("(pointer: coarse)").matches ? "Paylaş" : "İndir";
    popRow("Notlar", [["Kopyala", () => doExport("notes", "copy")], [share, () => doExport("notes", "save")]]);
    popRow("İlerleme raporu", [["Kopyala", () => doExport("report", "copy")], [share, () => doExport("report", "save")]]);
    popRow("Yedek", [[share, () => doExport("backup", "save")], ["Yükle", importBackup]]);
  }

  let phoneInfo = null;     // sunucudan: telefonda açılacak adresler
  function loadInfo() {
    if (!sync.on || !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
    fetch("/bilgi", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((j) => {
      if (!j || !Array.isArray(j.urls)) return;
      const changed = JSON.stringify(j) !== JSON.stringify(phoneInfo);
      phoneInfo = j;
      if (changed && !pop.hidden && !cloudUI.open) renderPop();
    }).catch(() => {});
  }
  // Telefon tarafı: okul/kütüphane bilgisayarı için misafir bağlantısı
  function renderGuestShare(say) {
    const c = cloudCfg();
    if (!c || !c.u) return;
    const g = read("odak.guest", null);
    if (!g || !g.t) {
      const s = say("Okul ya da kütüphane bilgisayarı için misafir bağlantısı: ana jetonun bilgisayara hiç gitmez, ayrı ve süreli bir jeton kullanılır. ");
      const a = document.createElement("a");
      a.href = "https://github.com/settings/tokens/new?scopes=gist&description=Odak-misafir&default_expires_at=7";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Misafir jetonu oluştur";
      s.appendChild(a);
      s.append(" (gist izni, 7 gün süreli), sonra buraya yapıştır:");
      const i = document.createElement("input");
      i.type = "text";
      i.className = "cin";
      i.placeholder = "ghp_…  (misafir jetonu)";
      i.value = cloudUI.gt;
      i.autocomplete = "off";
      i.setAttribute("autocapitalize", "off");
      i.setAttribute("autocorrect", "off");
      i.spellcheck = false;
      i.addEventListener("input", () => { cloudUI.gt = i.value; });
      pop.appendChild(i);
      const m = document.createElement("div");
      m.className = "cmsg";
      m.textContent = cloudUI.gmsg;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "Kaydet";
      b.addEventListener("click", async () => {
        const set = (t) => { cloudUI.gmsg = t; m.textContent = t; };
        try {
          const tk = cloudUI.gt.trim();
          if (!/^[A-Za-z0-9_]{20,}$/.test(tk)) throw new Error("Jeton biçimi yanlış görünüyor.");
          if (tk === c.t) throw new Error("Bu, ana jetonla aynı. Ayrı bir misafir jetonu oluştur.");
          set("Deneniyor…");
          const [rg, ru] = await Promise.all([
            fetchTimed("https://api.github.com/gists/" + c.g, { headers: ghHeaders(tk) }, 15000),
            fetchTimed("https://api.github.com/user", { headers: ghHeaders(tk) }, 15000)
          ]);
          if (ru.status === 401) throw new Error("Jeton geçersiz ya da süresi dolmuş.");
          if (!rg.ok || !ru.ok) throw new Error("GitHub hatası: " + (rg.ok ? ru.status : rg.status));
          const jg = await rg.json(), ju = await ru.json();
          if (!jg.owner || jg.owner.login !== ju.login) throw new Error("Bu jeton, kaydın durduğu GitHub hesabına ait değil.");
          const sc = ru.headers.get("x-oauth-scopes");
          if (sc !== null && !/\bgist\b/.test(sc)) throw new Error("Jetonda gist izni yok.");
          write("odak.guest", { t: tk });
          cloudUI.gt = ""; cloudUI.gmsg = "";
          renderPop();
        } catch (e) {
          set((e && e.message) || "Kaydedilemedi.");
        }
      });
      pop.appendChild(b);
      pop.appendChild(m);
      return;
    }
    popRow("Misafir bağlantısı", [
      ["Paylaş", async () => {
        const link = guestLink();
        if (!link) return;
        if (navigator.share) { try { await navigator.share({ url: link }); } catch (_) {} return; }
        try { await navigator.clipboard.writeText(link); flash("Misafir bağlantısı kopyalandı."); } catch (_) { flash("Kopyalanamadı."); }
      }],
      ["Kopyala", async () => {
        try { await navigator.clipboard.writeText(guestLink()); flash("Misafir bağlantısı kopyalandı."); } catch (_) { flash("Kopyalanamadı."); }
      }],
      ["Jetonu sil", () => { write("odak.guest", null); renderPop(); }]
    ]);
    say("Bilgisayarda bağlantıyı aç. Bitince sekmeyi kapat ve WhatsApp Web'den çıkış yap.");
  }

  function renderCloud() {
    const c = cloudCfg();
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = "Bulut";
    const val = document.createElement("span");
    val.className = "val";
    val.id = "cloudVal";
    val.style.minWidth = "0";
    val.textContent = cloudText();
    const btn = document.createElement("button");
    btn.type = "button";
    row.append(name, val, btn);
    pop.appendChild(row);
    const say = (text) => { const d = document.createElement("div"); d.className = "sy"; d.textContent = text; pop.appendChild(d); return d; };

    if (c) {
      btn.textContent = "Şimdi";
      btn.addEventListener("click", () => { val.textContent = "…"; syncNow(true); });
      if (GUEST) {
        say("Misafir oturumu: bu sekmeyi kapatınca kayıtlar ve jeton bu bilgisayardan silinir. İşin bitince WhatsApp Web'den de çıkış yap.");
        const end = document.createElement("button");
        end.type = "button";
        end.textContent = "Oturumu bitir";
        end.addEventListener("click", () => {
          try { sessionStorage.clear(); } catch (_) {}
          location.replace(location.pathname + location.search);
        });
        pop.appendChild(end);
        return;
      }
      const link = cloudLink();
      if (link) {
        say("Başka cihazı bağla: kamerayla okut. Telefonda ana ekrana eklemeden önce bu bağlantıyla aç.");
        const qr = QR.svg(link, 176);
        if (qr) {
          const box = document.createElement("div");
          box.className = "qr";
          box.appendChild(qr);
          pop.appendChild(box);
        } else {
          say(link);
        }
      } else {
        say("Başka cihaz için yayın adresi gerekli: bağlantıyı kesip adresle yeniden bağlan.");
      }
      renderGuestShare(say);
      const off = document.createElement("button");
      off.type = "button";
      off.textContent = cloudUI.confirmOff ? "Emin misin? Tekrar dokun" : "Bağlantıyı kes";
      off.addEventListener("click", () => {
        if (!cloudUI.confirmOff) { cloudUI.confirmOff = true; renderPop(); return; }
        cloudUI.confirmOff = false;
        try { localStorage.removeItem("odak.cloud"); } catch (_) {}
        try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {}
        sync.cok = null; sync.clast = 0; sync.cfirst = false;
        paintSync();
        renderPop();
      });
      pop.appendChild(off);
      return;
    }

    btn.textContent = cloudUI.open ? "Kapat" : "Kur";
    btn.addEventListener("click", () => { cloudUI.open = !cloudUI.open; renderPop(); });
    if (!cloudUI.open) return;

    const hosted = location.protocol === "https:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const s1 = document.createElement("div");
    s1.className = "sy";
    s1.append("Bilgisayar kapalıyken de (okulda) çalışsın diye kaydın kendi GitHub hesabındaki gizli bir dosyada da durur. 1) Bu bağlantıdan jeton oluştur (gist izni hazır gelir): ");
    const a = document.createElement("a");
    a.href = "https://github.com/settings/tokens/new?scopes=gist&description=Odak";
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "jeton oluştur";
    s1.appendChild(a);
    s1.append(". Sonra jetonu buraya yapıştır (başka cihazdan aldığın kurulum bağlantısı da olur):");
    pop.appendChild(s1);

    const mk = (ph, key) => {
      const i = document.createElement("input");
      i.type = "text";
      i.className = "cin";
      i.placeholder = ph;
      i.value = cloudUI[key];
      i.autocomplete = "off";
      i.setAttribute("autocapitalize", "off");
      i.setAttribute("autocorrect", "off");
      i.spellcheck = false;
      i.addEventListener("input", () => { cloudUI[key] = i.value; });
      pop.appendChild(i);
      return i;
    };
    const tok = mk("ghp_…  ya da  kurulum bağlantısı", "token");
    let urlIn = null;
    if (!hosted) {
      say("2) Sayfanın GitHub Pages adresi (telefona QR verebilmek için):");
      urlIn = mk("https://kullanici.github.io/odak/odak.html", "url");
    }
    const msg = document.createElement("div");
    msg.className = "cmsg";
    msg.textContent = cloudUI.msg;
    const go = document.createElement("button");
    go.type = "button";
    go.textContent = "Bağlan";
    go.addEventListener("click", async () => {
      const setMsg = (t) => { cloudUI.msg = t; msg.textContent = t; };
      try {
        setMsg("Bağlanıyor…");
        const raw = tok.value.trim();
        const pageUrl = hosted ? location.origin + location.pathname : (urlIn ? urlIn.value.trim() : "");
        if (pageUrl && !/^https:\/\//.test(pageUrl)) throw new Error("Adres https:// ile başlamalı.");
        if (!raw) throw new Error("Jetonu ya da kurulum bağlantısını yapıştır.");
        if (/bulut=/.test(raw) || /^eyJ/.test(raw)) {
          const o = cloudParse(raw);
          if (!o) throw new Error("Kurulum bağlantısı okunamadı.");
          const base = /^https?:\/\//.test(raw) ? raw.split("#")[0] : "";
          write("odak.cloud", { t: o.t, g: o.g, u: base || pageUrl });
        } else {
          await cloudConnect(raw, pageUrl);
        }
        cloudUI.open = false; cloudUI.token = ""; cloudUI.url = ""; cloudUI.msg = "";
        sync.cfirst = false;
        renderPop();
        paintSync();
        syncNow(true);
      } catch (e) {
        setMsg((e && e.message) || "Bağlanamadı.");
      }
    });
    pop.appendChild(go);
    pop.appendChild(msg);
  }

  function renderPop() {
    pop.textContent = "";
    loadInfo();
    renderTheme();
    renderCloud();
    if (sync.on) {
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = "Sunucu";
      const val = document.createElement("span");
      val.className = "val";
      val.id = "syncVal";
      val.style.minWidth = "0";
      val.textContent = syncText();
      const now = document.createElement("button");
      now.type = "button";
      now.textContent = "Şimdi";
      now.addEventListener("click", () => { val.textContent = "…"; syncNow(true); });
      row.append(name, val, now);
      pop.appendChild(row);
      if (phoneInfo) {
        const best = phoneInfo.tunnel || (phoneInfo.lan && phoneInfo.urls.length ? phoneInfo.urls[0] : "");
        const sy = document.createElement("div");
        sy.className = "sy";
        if (phoneInfo.tunnel) sy.textContent = "Telefonda aç (internet üzerinden, her yerde çalışır). Kamerayla okut:";
        else if (best) sy.textContent = "Telefonda (aynı Wi‑Fi) aç. Kamerayla okut:";
        else sy.textContent = "Telefon için bilgisayarda telefon.bat dosyasını çalıştır (ek ayar gerekmez).";
        pop.appendChild(sy);
        if (best) {
          const qr = QR.svg(best, 176);
          if (qr) {
            const box = document.createElement("div");
            box.className = "qr";
            box.appendChild(qr);
            pop.appendChild(box);
          }
          const u = document.createElement("div");
          u.className = "sy";
          const bb = document.createElement("b");
          bb.textContent = qr ? best.replace(/\?k=.*/, "?k=…") : best;
          u.appendChild(bb);
          pop.appendChild(u);
        }
      }
    }
    renderExport();
    const topRow = document.createElement("div");
    topRow.className = "foot";
    topRow.style.justifyContent = "flex-start";
    const ses = document.createElement("button");
    ses.type = "button";
    ses.textContent = "Oturumu başlat (B)";
    ses.addEventListener("click", () => { closePop(); sessionStart(); });
    topRow.appendChild(ses);
    pop.appendChild(topRow);
    SETS.forEach(([key, label, min, max, step]) => {
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = label;
      const val = document.createElement("span");
      val.className = "val";
      val.textContent = setText(key);
      const mk = (txt, d) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = txt;
        b.addEventListener("click", () => {
          const wasFull = !running && remain === dur(mode);
          pomo[key] = Math.min(max, Math.max(min, pomo[key] + d * step));
          val.textContent = setText(key);
          state.prefsAt = Date.now();
          saveState();
          if (wasFull) remain = dur(mode);
          paintPomo();
        });
        return b;
      };
      row.append(name, mk("−", -1), val, mk("+", 1));
      pop.appendChild(row);
    });
    const foot = document.createElement("div");
    foot.className = "foot";
    const reset = document.createElement("button");
    reset.type = "button";
    reset.textContent = "Sıfırla";
    reset.addEventListener("click", () => { pomoReset(); closePop(); });
    const test = document.createElement("button");
    test.type = "button";
    test.textContent = "Sesi dene";
    test.addEventListener("click", () => alarmStart(5));
    foot.append(test, reset);
    pop.appendChild(foot);
  }

  function closePop() { pop.hidden = true; updatePeek(); }
  $("pomoSet").addEventListener("click", () => {
    if (pop.hidden) { closePanels(); renderPop(); pop.hidden = false; updatePeek(); }
    else closePop();
  });
  // Tıklanan öğe, işleyici içinde yeniden çizilip DOM'dan çıkabilir; bu yüzden olay yolu kullanılır
  document.addEventListener("pointerdown", (e) => {
    const path = e.composedPath ? e.composedPath() : [];
    const inside = (n) => path.includes(n);
    if (!pop.hidden && !inside(pop) && e.target.id !== "pomoSet") closePop();
    if (!menuEl.hidden && !inside(menuEl) && !inside(courseBtn)) closeMenu();
    if (!statsEl.hidden && !inside(statsEl) && !inside(statsBtn)) closeStats();
    if (!notesEl.hidden && !inside(notesEl) && !inside(notesBtn)) closeNotes();
  });
  pomoBtn.addEventListener("click", pomoToggle);
  addEventListener("pointerdown", () => { audioInit(); alarmStop(); }, true);
  addEventListener("touchend", () => audioInit(), true);   // iOS ses kilidini touchend/click ile açar
  addEventListener("click", () => audioInit(), true);
  addEventListener("keydown", () => alarmStop(), true);
  $("restSkip").addEventListener("click", pomoSkipBreak);

  // ── Başlangıç ──
  if (location.protocol === "file:") {
    note("Bu sayfa file:// ile açıldı; YouTube bunu reddeder (Hata 153). baslat.bat dosyasına çift tıkla ya da http://localhost:8000/odak.html adresini aç. Telefonda: baslat.bat penceresinde yazan adresi aç.");
  }
  paintCourses();
  paintSpeed();
  paintList();
  paintPomo();
  paintStatsBtn();
  if (cloudImportHash()) note("Bulut bağlandı. Kayıtların bu cihaza geliyor…");
  paintSync();
  setInterval(paintStatsBtn, 600000);
  if (cloudOn()) scheduleSync(400);
  if (sync.on) scheduleSync(1200);      // eski sürümden gelen kaydı yeni şekle yükseltmek için
  loadInfo();
  ids = lists[pid()] || [];
  idx = startIndex(cur);
  renderList();

  const api = document.createElement("script");
  api.src = "https://www.youtube.com/iframe_api";
  api.onerror = () => note("YouTube oynatıcısı yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.");
  document.head.appendChild(api);
  setTimeout(() => { if (!ready && location.protocol !== "file:") note("Oynatıcı hâlâ hazır değil. İnternet bağlantını kontrol edip sayfayı yenile."); }, 12000);
</script>
</body>
</html>
