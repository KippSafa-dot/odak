<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<script>try{if(localStorage.getItem("odak.theme")==="paper"){document.documentElement.setAttribute("data-theme","paper");document.querySelector('meta[name="theme-color"]').setAttribute("content","#f4ecd8");}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Odak">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/ikon.png">
<title>Odak</title>
<style>
  /* ── Renk temaları: koyu (varsayılan) ve kağıt (sepya, parlak ortam için) ── */
  :root {
    color-scheme: dark;
    --bg: #000000; --surf: #161616; --surf2: #1c1c1c; --line: #1e1e1e; --line2: #222222;
    --c0: #2a2a2a; --c1: #2b2b2b; --c2: #2f2f2f; --c3: #333333; --c4: #3a3a3a; --c5: #4a4a4a;
    --c6: #6a6a6a; --c7: #7a7a7a; --c8: #8a8a8a; --c9: #9a9a9a; --c10: #aaaaaa;
    --blue: #7fb0ff; --blue2: #3f6aa8; --green: #4d8a63; --amber: #a8883f; --note: #6a5a3a; --ok: #2f6b48;
  }
  :root[data-theme="paper"] {
    color-scheme: light;
    --bg: #f4ecd8; --surf: #e9dec3; --surf2: #e4d8bb; --line: #d9cba7; --line2: #d2c39e;
    --c0: #b3a68a; --c1: #a09373; --c2: #9d9072; --c3: #8d8064; --c4: #7e7157; --c5: #65583f;
    --c6: #54472e; --c7: #46391f; --c8: #3a2f1a; --c9: #2f2614; --c10: #2a2210;
    --blue: #1f4d8f; --blue2: #2f5f9e; --green: #3f7a4f; --amber: #8a5f12; --note: #6e5a2a; --ok: #3f7a4f;
  }
  .player, .player iframe { background: #000000; }   /* video alanı iki temada da koyu kalır */

  * { margin: 0; padding: 0; box-sizing: border-box; background: var(--bg); }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    color: var(--c5);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;      /* Safari'de adres çubuğu açılıp kapanınca bile ekrana tam oturur */
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }

  /* ── Sahne: video + (isteğe bağlı) liste ── */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 20px;
    padding: 2vh 2vw 0;
    transition: padding 0.25s ease;
  }

  .video {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: size;
  }

  /* Hem genişliğe hem yüksekliğe sığan en büyük 16:9 kutu */
  .player {
    width: min(100cqw, calc(100cqh * 16 / 9));
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ── Oynatma listesi ── */
  .listwrap { width: 340px; flex-shrink: 0; min-height: 0; display: flex; flex-direction: column; }
  .listwrap[hidden] { display: none; }
  .lf { display: flex; align-items: center; gap: 12px; padding: 0 6px 8px 8px; }
  .lf input {
    flex: 1; min-width: 0; border: 0; border-bottom: 1px solid var(--surf); outline: none;
    color: var(--c8); font: inherit; font-size: 13px; padding: 4px 0;
  }
  .lf input:focus { border-bottom-color: var(--blue2); }
  .lf input::placeholder { color: var(--c2); }
  .lf button { border: none; outline: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--c4); padding: 4px 2px; }
  .lf button:hover { color: var(--c7); }
  .lf button.on { color: var(--blue); }
  .list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) var(--bg);
    transition: opacity 0.2s ease;
  }
  .list[hidden] { display: none; }
  .list.loading { opacity: 0.35; pointer-events: none; }

  .item {
    display: flex;
    align-items: baseline;
    cursor: pointer;
    font-size: 13.5px;
    line-height: 1.35;
    color: var(--c5);
    padding: 7px 4px 7px 8px;
    transition: color 0.15s ease;
  }
  .item:hover { color: var(--c8); }
  .item.current { color: var(--blue); }
  .item[hidden] { display: none; }
  .item .n { min-width: 2.6em; opacity: 0.6; }
  .item .nt { font-size: 11px; color: var(--c4); margin: 0 4px 0 6px; white-space: nowrap; }
  .item .a {
    width: 1.8em; text-align: center; flex-shrink: 0; opacity: 0; color: var(--c5);
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .item:hover .a { opacity: 0.45; }
  .item .a:hover { color: var(--amber); opacity: 1; }
  .item.applied .a { opacity: 1; color: var(--amber); }
  .item .t { flex: 1; }
  .item .c {
    width: 2em;
    text-align: center;
    flex-shrink: 0;
    opacity: 0;
    color: var(--c5);
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .item:hover .c { opacity: 0.55; }
  .item .c:hover { color: var(--c8); opacity: 1; }
  .item.done:not(.current) { color: var(--c1); }
  .item.done .c { opacity: 1; color: var(--green); }
  .item.resume:not(.current) .t::after {
    content: "  · kaldığın yer";
    font-size: 11px;
    color: var(--blue2);
  }

  /* ── Alt çubuk ── */
  .bar {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 4px 28px;
    padding: 10px 2vw 14px;
    transition: opacity 0.3s ease;
  }
  .center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 18px; }

  .bar button {
    border: none;
    outline: none;
    box-shadow: none;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.02em;
    padding: 6px 2px;
    color: var(--c5);
    transition: color 0.2s ease;
  }
  .bar button:hover { color: var(--c7); }
  .bar button.active { color: var(--blue); }
  .bar button:focus-visible { text-decoration: underline; text-underline-offset: 6px; }
  #counter { font-size: 13px; color: var(--c4); min-width: 4.5em; text-align: center; }

  #courseBtn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #courseBtn .grp { color: var(--c3); }

  #pomo.active #pomoTime { color: var(--blue); }
  #pomoRound { font-size: 12px; color: var(--c4); margin-left: 4px; }

  /* ── Açılır paneller: kurs menüsü ve ilerleme ── */
  .menu {
    position: absolute;
    left: 2vw;
    right: 2vw;
    bottom: 100%;
    z-index: 5;
    max-height: 70vh;
    max-height: 70dvh;
    overflow-y: auto;
    padding: 16px 4px 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) var(--bg);
  }
  .menu[hidden] { display: none; }
  .menu .span { grid-column: 1 / -1; }
  .menu h3 {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--c2);
    padding: 0 2px 4px;
  }
  .menu button {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    text-align: left;
  }
  .menu .meta { font-size: 12px; color: var(--c3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .menu button.active .meta { color: var(--blue2); }

  /* İlerleme paneli */
  .sum { display: flex; flex-wrap: wrap; gap: 12px 56px; }
  .sum .k { font-size: 12px; color: var(--c3); padding-bottom: 2px; }
  .sum .v { font-size: 20px; font-weight: 300; color: var(--c6); font-variant-numeric: tabular-nums; }
  .week { display: flex; align-items: flex-end; gap: 12px; height: 76px; }
  .week .col { flex: 0 0 30px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; }
  .week .b { width: 6px; min-height: 2px; background: var(--surf2); border-radius: 2px; }
  .week .b.on { background: var(--blue2); }
  .week .d { font-size: 11px; color: var(--c2); }
  .week .col.today .d { color: var(--c6); }
  .cr {
    display: grid;
    grid-template-columns: 1fr 64px 56px 40px;
    align-items: center;
    gap: 12px;
    padding: 5px 2px;
    font-size: 14px;
    color: var(--c5);
  }
  .cr .ap { font-size: 12px; color: var(--amber); text-align: right; }
  .gr { display: grid; grid-template-columns: 1fr 64px 96px; gap: 12px; align-items: center; padding: 5px 2px; font-size: 14px; color: var(--c5); }
  .gr .ct { font-size: 12px; color: var(--c3); text-align: right; font-variant-numeric: tabular-nums; }
  .rv { display: flex; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 14px; color: var(--c5); }
  .rv .rvt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv.go { cursor: pointer; }
  .rv.go .rvt:hover { color: var(--c8); }
  .rv .rvs { font-size: 12px; color: var(--c3); white-space: nowrap; }
  .rv .rvk { color: var(--green); cursor: pointer; opacity: 0.6; }
  .rv .rvk:hover { opacity: 1; }
  #notes { left: 50%; right: auto; width: min(760px, 96vw); transform: translateX(-50%); grid-template-columns: 1fr; }
  .ni { width: 100%; border: 0; border-bottom: 1px solid var(--line); outline: none; color: var(--c9); font: inherit; font-size: 16px; padding: 8px 2px; }
  .ni:focus { border-bottom-color: var(--blue2); }
  .ni::placeholder { color: var(--c2); }
  .nr { display: grid; grid-template-columns: 58px 1fr 20px; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 14px; color: var(--c6); }
  .nr .ck { color: var(--blue2); cursor: pointer; font-variant-numeric: tabular-nums; }
  .nr .x { color: var(--c3); cursor: pointer; text-align: center; }
  .nr .x:hover { color: var(--c8); }
  .act { font-size: 13px; color: var(--c4); cursor: pointer; padding-top: 6px; }
  .act:hover { color: var(--c7); }
  .rest input {
    width: min(480px, 80%); border: 0; border-bottom: 1px solid var(--line); outline: none; color: var(--c8);
    font: inherit; font-size: 15px; padding: 6px 2px; text-align: center;
  }
  .rest input[hidden] { display: none; }
  .rest input:focus { border-bottom-color: var(--blue2); }
  .rest input::placeholder { color: var(--c2); }
  #ask {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
  }
  #ask[hidden] { display: none; }
  #ask label { font-size: 14px; letter-spacing: 0.12em; color: var(--c4); }
  #ask input {
    width: min(560px, 86vw); border: 0; border-bottom: 1px solid var(--line); outline: none; color: var(--c9);
    font: inherit; font-size: 20px; padding: 8px 2px; text-align: center;
  }
  #ask input:focus { border-bottom-color: var(--blue2); }
  #ask input::placeholder { color: var(--c0); }
  #ask .hint { font-size: 12px; color: var(--c2); }
  #ask button { border: none; outline: none; cursor: pointer; font: inherit; font-size: 13px; color: var(--c4); padding: 4px 6px; }
  #ask button:hover { color: var(--c7); }
  .pop { max-height: 62vh; max-height: 62dvh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) var(--bg); }
  .mini { height: 2px; background: var(--surf); border-radius: 2px; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--blue2); }
  .cr > span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr .ct { font-size: 12px; color: var(--c3); text-align: right; font-variant-numeric: tabular-nums; }

  /* Mola ekranı: video örtülür, sadece kalan süre görünür */
  .rest {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .rest[hidden] { display: none; }
  .rest .lbl { font-size: 14px; letter-spacing: 0.2em; color: var(--c3); }
  .rest .time { font-size: clamp(40px, 9cqw, 110px); font-weight: 200; color: var(--c5); font-variant-numeric: tabular-nums; }
  .rest button {
    border: none; outline: none; cursor: pointer; font: inherit; font-size: 14px;
    color: var(--c4); padding: 6px 4px; transition: color 0.2s ease;
  }
  .rest button:hover { color: var(--c7); }

  /* Pomodoro ayarları */
  .pop {
    position: absolute;
    right: 2vw;
    bottom: 100%;
    z-index: 4;
    padding: 6px 4px 10px;
    min-width: 230px;
  }
  .pop[hidden] { display: none; }
  .pop .row { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
  .pop .row .name { flex: 1; font-size: 14px; color: var(--c5); }
  .pop .row .val { min-width: 3.2em; text-align: center; font-size: 14px; color: var(--blue); font-variant-numeric: tabular-nums; }
  .pop .foot { display: flex; justify-content: flex-end; gap: 16px; padding-top: 6px; }

  #note { color: var(--note); font-size: 13px; padding: 0 16px 6px; text-align: center; }
  #note[hidden] { display: none; }

  /* ── Sade mod: sadece video; çubuk fareyle alta gelince görünür ── */
  body.zen .stage { padding: 1vh 1vw 0; }
  body.zen .listwrap { display: none; }
  body.zen .bar.peek { opacity: 1; }
  body.zen .bar { opacity: 0; }
  body.zen .bar:hover, body.zen .bar:focus-within { opacity: 1; }

  @media (max-width: 900px) {
    .listwrap { position: absolute; top: 0; right: 2vw; bottom: 0; width: min(340px, 85vw); z-index: 2; }
    .bar { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ── Eşitleme göstergesi, not eylemi, sade modda dokunmatik erişim ── */
  #note .nact { border: none; outline: none; cursor: pointer; font: inherit; color: var(--blue); padding: 8px 10px; }
  #syncDot { display: none; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; vertical-align: middle; }
  #hot { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: calc(56px + env(safe-area-inset-bottom, 0px)); z-index: 6; }
  .pop .sy { font-size: 12px; color: var(--c5); padding: 2px 0 8px; line-height: 1.6; max-width: 320px; }
  .pop .sy b { font-weight: 400; color: var(--c7); user-select: text; -webkit-user-select: text; word-break: break-all; }
  .pop .sy a { color: var(--blue); }
  .pop .cin { width: 100%; max-width: 320px; margin: 4px 0; padding: 8px 2px; border: none; border-bottom: 1px solid var(--line2); color: var(--c10); font: inherit; font-size: 16px; outline: none; }
  .pop .cmsg { font-size: 12px; color: var(--amber); min-height: 1em; padding: 2px 0 6px; max-width: 320px; line-height: 1.5; }
  .pop .qr { padding: 4px 0 8px; }
  .pop .qr svg { display: block; border-radius: 6px; }

  /* ── Dokunmatik ekranlar (iPhone): fare yok, parmak var ── */
  @media (hover: none) {
    .item { align-items: center; padding: 10px 0 10px 8px; font-size: 15px; }
    .item .nt { font-size: 12px; }
    .item .c, .item .a { width: 44px; padding: 8px 0; opacity: 0.45; }
    .item.applied .a, .item.done .c { opacity: 1; }
    .bar button { min-height: 44px; padding: 10px 8px; }
    .menu button { padding: 12px 4px; }
    .lf button { min-height: 44px; padding: 8px 8px; font-size: 13px; }
    .lf input, .rest input, .ni, #ask input { font-size: 16px; }   /* 16 px altında iOS yazarken sayfayı yakınlaştırır */
    .pop .row { padding: 4px 0; }
    .pop .row button { min-width: 44px; }
    .nr { padding: 10px 2px; }
    .nr .x { padding: 0 10px; }
    #ask .hint { display: none; }
    #ask button, .rest button { min-height: 44px; padding: 10px 14px; }
    /* Sade mod: çubuk gizli; alt kenara dokununca 6 sn görünür */
    body.zen #hot { display: block; }
    body.zen #hot.off { display: none; }
    body.zen .bar:not(.peek):not(.touch) { pointer-events: none; }
    body.zen .bar:hover:not(.peek):not(.touch), body.zen .bar:focus-within:not(.peek):not(.touch) { opacity: 0; }
    body.zen .bar.touch { opacity: 1; }
  }

  /* Dikey telefon: video üstte, liste altta, denetimler en altta */
  @media (max-width: 700px) and (orientation: portrait) {
    .stage { flex-direction: column; gap: 6px; padding: 0; }
    .video { flex: none; width: 100%; aspect-ratio: 16 / 9; }
    .player { border-radius: 0; }
    .listwrap { position: static; width: 100%; flex: 1; min-height: 0; z-index: auto; }
    .lf { padding: 0 8px 4px; }
    body.zen .stage { justify-content: center; }
    .bar { gap: 0 8px; padding: 4px 2vw calc(8px + env(safe-area-inset-bottom, 0px)); }
    .bar .t1, .bar .t2, .bar .center { width: 100%; flex: none; }
    .bar .t1, .bar .t2 { justify-content: space-between; gap: 0; }
    .bar .center { justify-content: space-between; gap: 8px; }
    .bar .t2 button { padding-left: 4px; padding-right: 4px; font-size: 13px; }
    .menu, .pop { left: 2vw; right: 2vw; }
    .menu { grid-template-columns: minmax(0, 1fr); }
    .sum { gap: 12px 28px; }
    #notes { left: 2vw; width: auto; transform: none; }
  }

  /* Yatay telefon: çubuğu inceltip videoya yer aç */
  @media (orientation: landscape) and (max-height: 500px) {
    .bar { padding-top: 2px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); gap: 0 14px; }
    .bar button { min-height: 36px; padding-top: 6px; padding-bottom: 6px; }
    .stage { padding-top: 1vh; }
    .listwrap { position: static; width: min(300px, 40vw); z-index: auto; }
  }
  /* ── Yumuşak köşeli paneller (kurs menüsü, ilerleme, not, ayar) ──
     Tüm öğeler "background: var(--bg)" kullandığı için panelin içinde --bg'yi
     panel rengine çekmek, çocukların da aynı zemini almasını sağlar. */
  :root { --panel: var(--surf); --panel2: var(--surf2); }
  .menu, .pop {
    --bg: var(--panel);
    --surf: var(--panel2);
    --surf2: var(--line2);
    border: 1px solid var(--line2);
    border-radius: 22px;
    padding: 18px 20px 14px;
    margin-bottom: 8px;
    overscroll-behavior: contain;
  }

  /* Açılış animasyonu: panel alttan hafifçe süzülüp yerine oturur.
     "translate"/"scale" ayrı özellikler olduğu için #notes'un transform ile ortalanması bozulmaz. */
  @keyframes panelIn {
    from { opacity: 0; translate: 0 14px; scale: 0.97; }
    to   { opacity: 1; translate: 0 0;    scale: 1; }
  }
  .menu:not([hidden]), .pop:not([hidden]) {
    transform-origin: 50% 100%;
    animation: panelIn 340ms cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  @media (prefers-reduced-motion: reduce) {
    .menu:not([hidden]), .pop:not([hidden]) { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="video">
    <div class="player">
      <div class="rest" id="rest" hidden>
        <span class="lbl" id="restLbl">MOLA</span>
        <span class="time" id="restTime"></span>
        <input id="reflect" type="text" maxlength="200" autocomplete="off" enterkeyhint="done" spellcheck="false" hidden>
        <button type="button" id="restSkip">atla</button>
      </div>
    </div>
  </div>
  <div class="listwrap" id="listwrap" hidden>
    <div class="lf">
      <input id="q" type="text" placeholder="Ara…  ( / )" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="search" spellcheck="false">
      <button type="button" id="undoneBtn" title="Sadece bitmemiş videoları göster">Bitmemiş</button>
    </div>
    <div class="list loading" id="list"></div>
  </div>
</div>

<p id="note" hidden></p>

<div id="ask" hidden>
  <label id="askLbl"></label>
  <input id="askIn" type="text" maxlength="160" autocomplete="off" enterkeyhint="go" spellcheck="false">

<script>
  // ─────────────────────────────────────────────
  // KURSLARINI BURAYA EKLE
  // group: kursun alanı (menüde ve ilerleme panelinde bu başlık altında görünür)
  // playlistId: YouTube linkindeki "list=" sonrasındaki kısım.

  // total (isteğe bağlı): listedeki video sayısı. Kurs bir kez açılınca gerçek sayı kendiliğinden öğrenilir.
  // Sıra, menüdeki sıradır. Aynı alana ait kursları yan yana tut.
  // ─────────────────────────────────────────────
  const courses = [
    // Tasarım
    { group: "Tasarım",      name: "Fusion 360",            playlistId: "PLWctyKyPphPjDJhxcrZnGMKhiL82FFITo" },
    { group: "Tasarım",      name: "Fusion 360 Pratik",     playlistId: "PLqBk9LsxJMVw-wFsy0TlG8dv2V8KCt4rR" },
    { group: "Tasarım",      name: "AutoCAD",               playlistId: "PLZvK8tF4AB9BfvCuDlNpcCw6QTFEv00DU" },
    { group: "Tasarım",      name: "SolidWorks 2026",       playlistId: "PL8Qe6l9Q7kdovKoNS2aGPunoojqLkYHxA", total: 34 },

    // Programlama
    { group: "Programlama",  name: "C++ (Visual Studio)",   playlistId: "PLzupOkYTW5dSdcs6aquWkkjhv-2J5Fmwq", total: 46 },
    { group: "Programlama",  name: "Python",                playlistId: "PLdg_znGJeG88d5HwUOT40JaSaERU6n0aq", total: 58 },

    { group: "Arduino",      name: "Arduino",               playlistId: "PLkhSl_0v_U0JEJOo26ejZG8VrK_6hhsja", total: 86 },

    { group: "Arduino",      name: "Arduino Modüller",      playlistId: "PL1J0y2v7mkQzlEbjdOcKnC6Ziw7XGE8OU" },

    { group: "Gömülü",       name: "ESP8266",               playlistId: "PLdgdjpyKdKNNfNd61DDBWHmPJfZPLE81B" },
    { group: "Gömülü",       name: "ESP32",                 playlistId: "PLLvF0xxuY_qD4B-9fVF0hJNwKbVpT60zC" },
    { group: "Gömülü",       name: "Modern Embedded (EN)",  playlistId: "PLPW8O6W-1chwyTzI3BHwBLbGQoPFxPAPM", total: 58 },

    { group: "Elektronik",   name: "Electronics for Beginners (EN)", playlistId: "PL2z3V9RkHQE3E0sJBjmK6z_ixxuve5Sao", total: 29 }
  ];

  const STORE = "odak.v3";
  const OLD_STORE = "odak.v2";
  const TITLES = "odak.basliklar";
  const LISTS = "odak.listeler2";   // eski önbellek yanlış liste içerebildiği için yeni anahtar
  const RATES = [1, 1.25, 1.5, 1.75, 2];
  const DONE_AT = 0.9;        // videonun %90'ı izlenince "bitti" sayılır
  const STREAK_MIN = 600;     // günde en az 10 dk izlenen gün "seri"ye sayılır
  const PUSH_DELAY = 10000;   // sunucuyla eşitleme aralığı (ms); oynarken en geç bu kadar sürede bir

  // v2'de son kurs sıra numarasıyla tutuluyordu; eski sırayı ID'ye çevirmek için
  const LEGACY_ORDER = [
    "PLWctyKyPphPjDJhxcrZnGMKhiL82FFITo", "PLqBk9LsxJMVw-wFsy0TlG8dv2V8KCt4rR",
    "PLZvK8tF4AB9BfvCuDlNpcCw6QTFEv00DU", "PLcNWqzWzYG2v5_R_uPyLRzGXSoYgjfd8C",
    "PLkhSl_0v_U0JEJOo26ejZG8VrK_6hhsja", "PLkhSl_0v_U0IO4uoAxjJtWSQrp3jIgQ4h",
    "PL1J0y2v7mkQzlEbjdOcKnC6Ziw7XGE8OU", "PLdgdjpyKdKNNfNd61DDBWHmPJfZPLE81B",
    "PLLvF0xxuY_qD4B-9fVF0hJNwKbVpT60zC"
  ];

  const $ = (id) => document.getElementById(id);
  const listEl = $("list"), noteEl = $("note");
  const counterEl = $("counter"), speedBtn = $("speed"), listBtn = $("toggleList");
  const courseBtn = $("courseBtn"), menuEl = $("menu"), zenBtn = $("zenBtn");
  const statsEl = $("stats"), statsBtn = $("statsBtn");
  const notesEl = $("notes"), notesBtn = $("notesBtn"), barEl = document.querySelector(".bar");
  const resumeBtn = $("resumeBtn"), wrapEl = $("listwrap"), qIn = $("q"), undoneBtn = $("undoneBtn");
  const askEl = $("ask"), askIn = $("askIn"), askLbl = $("askLbl"), askSkip = $("askSkip"), reflectIn = $("reflect");
  const hotEl = $("hot");

  // ── Misafir oturumu ──
  // Telefondan gelen #misafir=… bağlantısı jetonu ve tüm kayıtları yalnızca bu sekmenin
  // sessionStorage'ına yazar; sekme kapanınca okul/kütüphane bilgisayarında hiçbir şey kalmaz.
  // Kod adresten hemen silinir (geçmişte ve adres çubuğunda görünmez).
  const store = (() => {
    try {
      const m = /^#misafir=([A-Za-z0-9_-]+)/.exec(location.hash);
      if (m) {
        const o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/")))));
        if (o && /^[A-Za-z0-9_]{20,}$/.test(o.t || "") && typeof o.g === "string" && /^[A-Za-z0-9]+$/.test(o.g)) {
          sessionStorage.setItem("odak.misafir", "1");
          sessionStorage.setItem("odak.cloud", JSON.stringify({ t: o.t, g: o.g, u: location.origin + location.pathname }));
        }
        history.replaceState(null, "", location.pathname + location.search);
      }
      return sessionStorage.getItem("odak.misafir") ? sessionStorage : localStorage;
    } catch (_) { return localStorage; }
  })();
  const GUEST = store !== localStorage;

  function read(key, fallback) {
    try { const v = JSON.parse(store.getItem(key)); return v == null ? fallback : v; }
    catch (_) { return fallback; }
  }
  function write(key, val) {
    try { store.setItem(key, JSON.stringify(val)); } catch (_) {}
  }
  function cleanId(value) {
    const m = String(value).match(/[?&]list=([\w-]+)/);
    return m ? m[1] : String(value).trim();
  }
  function embedSrc(id) {
    const origin = location.protocol.indexOf("http") === 0
      ? "&origin=" + encodeURIComponent(location.origin) : "";
    return "https://www.youtube-nocookie.com/embed/videoseries?list=" +
      encodeURIComponent(cleanId(id)) +
      "&enablejsapi=1&rel=0&showinfo=0&controls=1&playsinline=1" + origin;
  }
  function note(msg, act) {
    noteEl.textContent = msg || "";
    if (msg && act) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "nact";
      b.textContent = act.label;
      b.addEventListener("click", act.fn);
      noteEl.append(" ", b);
    }
    noteEl.hidden = !msg;
  }
  function dayKey(d) {
    d = d || new Date();
    const z = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }

  // ── Kayıt ve eşitleme ──
  // İlerleme üç yerde durur: bu tarayıcı (localStorage), sunucudaki odak-veri.json ve diğer cihaz.
  // Her cihaz kendi kopyasını tutar. Eşitlemede sunucudaki kopyayla BİRLEŞTİRİR, üzerine yazmaz;
  // bu yüzden iki cihaz aynı anda açık olsa da, biri çevrimdışı kalsa da kayıt kaybolmaz.
  // Kurallar mergeStates içinde: süre/pomodoro sayaçları cihaz başına tutulup toplanır, bitti/uyguladım/not
  // işaretleri birleşir (geri almalar iz bırakarak yayılır), "kaldığın yer" kurs başına en yeniye göre seçilir.

  // <<MERGE-BEGIN>>
  const LEGACY = "L0";                 // eski sürümden kalan sayaçların kovası
  const CTRS = ["time", "watch", "pomos"];
  const TOMB_TTL = 180 * 86400000;     // geri alma izleri 180 gün saklanır
  const isObj = (v) => !!v && typeof v === "object" && !Array.isArray(v);
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
  const clone = (v) => JSON.parse(JSON.stringify(v));

  // Her kaydı aynı şekle getirir. Eski sürümün dosyası (ctr yok) da burada yeni şekle çevrilir.
  function normalize(s) {
    const c = clone(isObj(s) ? s : {});
    ["progress", "done", "applied", "notes", "reviews", "rates", "del", "time", "watch", "pomos"].forEach((k) => {
      if (!isObj(c[k])) c[k] = {};
    });
    if (!Array.isArray(c.log)) c.log = [];
    if (!isObj(c.yol) || !isObj(c.yol.d)) delete c.yol;
    const saved = num(c.savedAt);
    c.lastAt = num(c.lastAt) || saved;
    c.prefsAt = num(c.prefsAt) || saved;
    Object.keys(c.progress).forEach((k) => {
      const p = c.progress[k];
      if (!isObj(p)) { delete c.progress[k]; return; }
      p.at = num(p.at) || saved;
    });
    if (!isObj(c.ctr)) {
      c.ctr = {};
      CTRS.forEach((n) => { c.ctr[n] = {}; c.ctr[n][LEGACY] = clone(c[n]); });
    }
    CTRS.forEach((n) => { if (!isObj(c.ctr[n])) c.ctr[n] = {}; });
    return c;
  }

  // time / watch / pomos: cihaz kovalarının toplamı
  function derive(c) {
    CTRS.forEach((n) => {
      const out = {};
      Object.keys(c.ctr[n]).forEach((dev) => {
        const bucket = c.ctr[n][dev];
        Object.keys(bucket).forEach((k) => { out[k] = (out[k] || 0) + num(bucket[k]); });
      });
      c[n] = out;
    });
  }

  function newerProgress(x, y) {
    if (!x) return y;
    if (!y) return x;
    if (num(y.at) !== num(x.at)) return num(y.at) > num(x.at) ? y : x;
    if (num(y.index) !== num(x.index)) return num(y.index) > num(x.index) ? y : x;
    return num(y.time) > num(x.time) ? y : x;
  }

  // İki kaydı birleştirir; hiçbirinin üzerine yazmaz. Sıra önemsizdir, tekrar çalıştırmak sonucu değiştirmez.
  function mergeStates(A, B) {
    const a = normalize(A), b = normalize(B), m = {};
    const now = Date.now();

    // Sayaçlar: her cihaz yalnızca kendi kovasını artırır; kova başına en büyük değer alınır, sonra toplanır.
    m.ctr = {};
    CTRS.forEach((n) => {
      m.ctr[n] = {};
      [a.ctr[n], b.ctr[n]].forEach((src) => {
        Object.keys(src).forEach((dev) => {
          if (!isObj(src[dev])) return;
          const dst = m.ctr[n][dev] || (m.ctr[n][dev] = {});
          Object.keys(src[dev]).forEach((k) => { dst[k] = Math.max(num(dst[k]), num(src[dev][k])); });
        });
      });
    });

    // Geri alma izleri ("d|kurs|video", "a|kurs|video", "n|kurs|video|zaman")
    m.del = {};
    [a.del, b.del].forEach((src) => Object.keys(src).forEach((k) => {
      const t = num(src[k]);
      if (t && now - t < TOMB_TTL) m.del[k] = Math.max(num(m.del[k]), t);
    }));

    // Bitti ve uyguladım: iki tarafta da varsa en yeni damga; geri alma izi daha yeniyse silinir
    const stamps = (field, tag) => {
      const out = {};
      [a[field], b[field]].forEach((src) => Object.keys(src).forEach((pid) => {
        const inner = src[pid];
        if (!isObj(inner)) return;
        Object.keys(inner).forEach((id) => {
          const v = inner[id] === true ? 1 : num(inner[id]);
          if (!v) return;
          const t = m.del[tag + "|" + pid + "|" + id];
          if (t && t > v) return;
          const o = out[pid] || (out[pid] = {});
          if (v > (o[id] || 0)) o[id] = v;
        });
      }));
      return out;
    };
    m.done = stamps("done", "d");
    m.applied = stamps("applied", "a");

    // Tekrar sayaçları: büyük olan; bitmemiş videoların kaydı atılır
    m.reviews = {};
    [a.reviews, b.reviews].forEach((src) => Object.keys(src).forEach((pid) => {
      const inner = src[pid];
      if (!isObj(inner)) return;
      Object.keys(inner).forEach((id) => {
        const v = num(inner[id]);
        if (v <= 0 || !(m.done[pid] && m.done[pid][id])) return;
        const o = m.reviews[pid] || (m.reviews[pid] = {});
        o[id] = Math.max(num(o[id]), v);
      });
    }));

    // Notlar: iki taraftakilerin birleşimi; silinenler geri gelmez
    m.notes = {};
    [a.notes, b.notes].forEach((src) => Object.keys(src).forEach((pid) => {
      const byVideo = src[pid];
      if (!isObj(byVideo)) return;
      Object.keys(byVideo).forEach((id) => {
        (Array.isArray(byVideo[id]) ? byVideo[id] : []).forEach((n) => {
          if (!n || typeof n.text !== "string" || !n.text) return;
          const at = num(n.at);
          if (m.del["n|" + pid + "|" + id + "|" + at]) return;
          const P = m.notes[pid] || (m.notes[pid] = {});
          const L = P[id] || (P[id] = []);
          if (!L.some((x) => x.at === at && x.text === n.text)) L.push({ t: num(n.t), text: n.text, at: at });
        });
      });
    }));
    Object.keys(m.notes).forEach((pid) => Object.keys(m.notes[pid]).forEach((id) => {
      m.notes[pid][id].sort((x, y) => (x.t - y.t) || (x.at - y.at));
    }));

    // Kaldığın yer: kurs başına en yeni kayıt
    m.progress = {};
    Object.keys(a.progress).concat(Object.keys(b.progress)).forEach((pid) => {
      m.progress[pid] = newerProgress(a.progress[pid], b.progress[pid]);
    });

    // Son açılan kurs
    const lastB = num(b.lastAt) > num(a.lastAt) ||
      (num(b.lastAt) === num(a.lastAt) && String(b.lastId || "") > String(a.lastId || ""));
    m.lastId = (lastB ? b.lastId : a.lastId) || a.lastId || b.lastId || "";
    m.lastAt = Math.max(num(a.lastAt), num(b.lastAt));

    // Ayarlar (hız, pomodoro): en son değiştirilen taraf
    const prefB = num(b.prefsAt) > num(a.prefsAt) ||
      (num(b.prefsAt) === num(a.prefsAt) && JSON.stringify(b.pomo || {}) > JSON.stringify(a.pomo || {}));
    const ps = prefB ? b : a, other = prefB ? a : b;
    if (ps.pomo || other.pomo) m.pomo = ps.pomo || other.pomo;
    if (ps.rate || other.rate) m.rate = ps.rate || other.rate;
    m.rates = (Object.keys(ps.rates).length || num(ps.prefsAt) > num(other.prefsAt)) ? ps.rates : other.rates;
    m.prefsAt = Math.max(num(a.prefsAt), num(b.prefsAt));

    // Oturum günlüğü: birleşim; boş kalan alanlar dolu olanla tamamlanır
    const L = {};
    [a.log, b.log].forEach((src) => src.forEach((e) => {
      if (!e || !num(e.ts)) return;
      const k = e.ts + "|" + e.pid, o = L[k];
      if (!o) L[k] = { ts: e.ts, pid: e.pid, intent: e.intent || "", learned: e.learned || "", min: num(e.min) };
      else {
        if (!o.intent && e.intent) o.intent = e.intent;
        if (!o.learned && e.learned) o.learned = e.learned;
      }
    }));
    m.log = Object.keys(L).map((k) => L[k]).sort((x, y) => x.ts - y.ts).slice(-200);

    // Yol haritası (kurs durumları): bütün olarak en yeni kayıt kazanır
    if (a.yol || b.yol) m.yol = num(b.yol && b.yol.t) > num(a.yol && a.yol.t) ? b.yol : (a.yol || b.yol);

    if (typeof a.list === "boolean") m.list = a.list;      // liste görünürlüğü cihaza özeldir
    m.savedAt = Math.max(num(a.savedAt), num(b.savedAt));
    derive(m);
    return m;
  }

  function canon(v) {
    if (Array.isArray(v)) return v.map(canon);
    if (isObj(v)) { const o = {}; Object.keys(v).sort().forEach((k) => { o[k] = canon(v[k]); }); return o; }
    return v;
  }
  // Sunucudaki kayıt birleşmiş kayıtla aynı mı? (aynıysa tekrar yazmaya gerek yok)
  function sameData(x, y) {
    const strip = (s) => { const c = clone(isObj(s) ? s : {}); delete c.savedAt; delete c.list; return JSON.stringify(canon(c)); };
    return strip(x) === strip(y);
  }
  // <<MERGE-END>>

  // <<QR-BEGIN>>
  // QR kodu üretici (bayt kipi, hata düzeltme seviyesi L, sürüm 1-10; ~270 bayta kadar). Dış kitaplık gerekmez.
  const QR = (function () {
    const ECC = [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18];   // blok başına düzeltme kodu sözcüğü (L)
    const NBLK = [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4];           // blok sayısı (L)
    const MAXV = 10;
    const rawModules = (v) => {
      let r = (16 * v + 128) * v + 64;
      if (v >= 2) { const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; }
      return r;
    };
    const dataWords = (v) => Math.floor(rawModules(v) / 8) - ECC[v] * NBLK[v];
    const rsMul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
    const rsDiv = (deg) => {
      const r = []; for (let i = 0; i < deg - 1; i++) r.push(0); r.push(1);
      let root = 1;
      for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = rsMul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = rsMul(root, 2); }
      return r;
    };
    const rsRem = (data, div) => {
      const r = div.map(() => 0);
      data.forEach((b) => { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= rsMul(c, f); }); });
      return r;
    };
    const alignPos = (v) => {
      if (v === 1) return [];
      const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
      const step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
      const res = [6];
      for (let p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
      return res;
    };
    const MASKS = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0
    ];

    function build(text) {
      const bytes = Array.from(new TextEncoder().encode(text));
      let ver = 0;
      for (let v = 1; v <= MAXV; v++) if (4 + (v <= 9 ? 8 : 16) + bytes.length * 8 <= dataWords(v) * 8) { ver = v; break; }
      if (!ver) return null;
      const bits = [];
      const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      put(4, 4); put(bytes.length, ver <= 9 ? 8 : 16); bytes.forEach((b) => put(b, 8));
      const cap = dataWords(ver) * 8;
      put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
      for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
      const data = [];

  const DEV = (() => {

  })();

  function loadRemote() {
    if (location.protocol.indexOf("http") !== 0) return { status: 0, data: null };
    try {
      const x = new XMLHttpRequest();
      x.open("GET", "/veri", false);
      x.send();
      if (x.status !== 200) return { status: x.status, data: null };
      const j = JSON.parse(x.responseText);

    } catch (_) { return { status: -1, data: null }; }
  }

  const rr = loadRemote();

  if (!local) {

    local = old ? {
      progress: old.progress, rate: old.rate, list: old.list, pomo: old.pomo,
      lastId: LEGACY_ORDER[old.last] || ""
    } : {};
  }
  const state = Object.assign({ lastId: "", lastAt: 0, prefsAt: 0, savedAt: 0 }, mergeStates(local, rr.data || {}));
  if (typeof state.list !== "boolean") state.list = true;
  if (!RATES.includes(state.rate)) state.rate = 1;
  state.pomo = Object.assign({ work: 50, short: 10, long: 25, rounds: 3, alarm: 12, vol: 70, intent: 1, reflect: 1, goalH: 0, goalV: 0 }, state.pomo);
  const titles = read(TITLES, {});
  const lists = read(LISTS, {});     // kurs başına son bilinen video ID'leri (liste anında görünsün diye)

  // Sunucu yoksa (dosya olarak açıldıysa) ya da /veri adresi yoksa eşitleme kapalıdır; kayıt yine tarayıcıdadır.
  const sync = {
    on: location.protocol.indexOf("http") === 0 && rr.status !== 404 && rr.status !== 405,
    busy: false, again: false, timer: null, due: 0,
    ok: rr.data ? true : null, last: rr.data ? Date.now() : 0,

  function saveState() {
    state.savedAt = Date.now();
    write(STORE, state);
    scheduleSync(PUSH_DELAY);
  }
  // Gecikmeli (oynarken en geç PUSH_DELAY'de bir) ama daha erken istenirse öne alınan eşitleme
  function scheduleSync(delay) {
    if (!sync.on && !cloudOn()) return;
    const due = Date.now() + delay;
    if (sync.timer && sync.due <= due) return;
    clearTimeout(sync.timer);
    sync.due = due;
    sync.timer = setTimeout(() => { sync.timer = null; syncNow(); }, delay);
  }
  function fetchTimed(url, opts, ms) {

      .finally(() => clearTimeout(to));
  }

  // Sayaç artırma: yalnızca bu cihazın kovası artar, ekrandaki toplam da birlikte güncellenir
  function bump(name, key, amt) {
    const own = state.ctr[name][DEV] || (state.ctr[name][DEV] = {});
    own[key] = (own[key] || 0) + amt;
    state[name][key] = (state[name][key] || 0) + amt;
  }

  // Bilgisayardaki sunucu (baslat.bat) ile eşitleme: oku, birleştir, gerekiyorsa geri yaz
  async function syncServer() {
    const r = await fetchTimed("/veri");
    if (!r.ok) throw new Error("http " + r.status);
    const remoteData = await r.json();
    const merged = mergeStates(state, isObj(remoteData) ? remoteData : {});
    adopt(merged);               // birleştirme ve uygulama aynı adımda; arada yerel değişiklik kaçmaz
    sync.pulled = true;

    }
  }

  // ── Bulut: kayıt, kendi GitHub hesabındaki özel (gizli) bir Gist'te de durur ──
  // Sayfa GitHub Pages'te, kayıt Gist'te olunca bilgisayar kapalıyken de (okulda, yolda) telefon çalışır.

  const GIST_FILE = "odak-veri.json";

  const b64d = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))));

  function cloudLink() {
    const c = cloudCfg();

  }
  // Misafir bağlantısı: ana jeton değil, ayrı (süreli) misafir jetonu taşır
  function guestLink() {
    const c = cloudCfg(), g = read("odak.guest", null);

  }
  // Bağlantıdan ya da yalnızca koddan {t, g} çıkarır
  function cloudParse(text) {
    const m = /bulut=([A-Za-z0-9_-]+)/.exec(text);
    const code = m ? m[1] : String(text).trim();
    try { const o = b64d(code); if (o && typeof o.t === "string" && typeof o.g === "string") return o; } catch (_) {}
    return null;
  }
  // Adresteki #bulut=… (telefonda QR ile açılınca) bu cihazı bağlar. Kod adreste bilerek kalır:
  // ana ekrana eklenen kısayol da bağlı açılsın.
  function cloudImportHash() {
    if (!/^#bulut=/.test(location.hash)) return false;

    if (!o) return false;
    const cur0 = cloudCfg();
    if (cur0 && cur0.t === o.t && cur0.g === o.g) return false;
    write("odak.cloud", { t: o.t, g: o.g, u: location.origin + location.pathname });
    return true;
  }
  async function cloudConnect(token, pageUrl) {
    if (!/^[A-Za-z0-9_]{20,}$/.test(token)) throw new Error("Jeton biçimi yanlış görünüyor.");
    const r = await fetchTimed("https://api.github.com/gists", {
      method: "POST", headers: ghHeaders(token, true),
      body: JSON.stringify({ description: "Odak ilerleme kaydı (otomatik)", public: false, files: { [GIST_FILE]: { content: JSON.stringify(state) } } })
    }, 20000);
    if (r.status === 401) throw new Error("Jeton geçersiz ya da süresi dolmuş.");
    if (r.status === 403 || r.status === 404) throw new Error("Jetonda gist izni yok. Bağlantıdaki hazır kutuyla oluştur.");
    if (!r.ok) throw new Error("GitHub hatası: " + r.status);

  }
  async function syncCloud() {
    const c = cloudCfg();

    if (r.status === 401) throw new Error("Jeton geçersiz ya da süresi dolmuş");

        method: "PATCH", headers: ghHeaders(c.t, true),

  // Açılıştan hemen sonra, diğer cihazda en son izlenen kursa geç (henüz bir şeye dokunulmadıysa)

  async function syncNow(force) {

  // Diğer cihazda bu kursta daha yeni bir yere gelinmişse, burada oynatmıyorsan atlamayı öner

  // Arama ve "bitmemiş" süzgeci: aktif video her zaman görünür
  function applyFilter() {
    const q = qIn.value.trim().toLocaleLowerCase("tr");
    const done = doneOf(pid());
    const items = listEl.children;
    for (let k = 0; k < items.length; k++) {
      const el = items[k], id = el.dataset.id, i = parseInt(el.dataset.i, 10);
      let ok = true;
      if (q) ok = el.children[1].textContent.toLocaleLowerCase("tr").includes(q) || String(i + 1) === q;   // ekranda görünen metin
      if (filterUndone && done[id]) ok = false;
      if (i === idx) ok = true;
      el.hidden = !ok;
    }
  }

  function highlight(force) {
    const items = listEl.children;
    const key = pid();
    const p = state.progress[key];
    const done = doneOf(key);
    const ap = state.applied[key] || {};
    const nts = state.notes[key] || {};
    for (let i = 0; i < items.length; i++) {
      const el = items[i], id = el.dataset.id;
      el.classList.toggle("current", i === idx);
      el.classList.toggle("done", !!done[id]);

  function bugunPlan() {
    let th = HAFTA[new Date().getDay()];
    const cand = (t) => courses.map((c, i) => i).filter((i) => yolOf(i) === "a" && TEMA[t].includes(courses[i].group));
    if (!cand(th).length) th = ["G", "T", "P"].find((t) => cand(t).length) || th;
    const cs = cand(th), share = Math.max(15, Math.round(BUGUN_DK / (cs.length || 1))), items = [];
    cs.forEach((i) => {
      const key = pidOf(i), ids = lists[key] || [], dn = state.done[key] || {};
      const durs = BUGUN_SURE[courses[i].name] || [], skip = ATLA[courses[i].name] || [], p = state.progress[key];
      let k = p ? p.index || 0 : 0, left = share, n = 0;
      for (; k < Math.max(ids.length, durs.length) && left > 0 && n < 4; k++) {
        if (skip.includes(k + 1) || (ids[k] && dn[ids[k]])) continue;
        const m = durs[k] || 15;
        items.push({ i, k, m }); left -= m; n++;

    });
    return { th, items };
  }

  function renderStats() {
    statsEl.textContent = "";
    const today = dayKey();
    const DAYS = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];

    const week = [];
    for (let k = 6; k >= 0; k--) {
      const d = new Date();
      d.setDate(d.getDate() - k);
      week.push({ key: dayKey(d), name: DAYS[d.getDay()], sec: state.time[dayKey(d)] || 0 });
    }
    const weekSec = week.reduce((a, w) => a + w.sec, 0);
    const cnt = (obj, i) => Object.keys(obj[pidOf(i)] || {}).length;
    const doneTotal = courses.reduce((a, c, i) => a + cnt(state.done, i), 0);
    const appliedTotal = courses.reduce((a, c, i) => a + cnt(state.applied, i), 0);

    const sum = el("div", "sum span");
    [
      ["Bugün", fmtDur(state.time[today] || 0) + " · " + (state.pomos[today] || 0) + " pomodoro"],
      ["Son 7 gün", fmtDur(weekSec)],
      ["Seri", streak() + " gün"],
      ["Biten video", String(doneTotal)],
      ["Uyguladım", String(appliedTotal)]
    ].forEach(([k, v]) => {
      const box = el("div");
      box.append(el("div", "k", k), el("div", "v", v));
      sum.appendChild(box);
    });
    statsEl.appendChild(sum);

    const chart = el("div", "week span");
    const scale = Math.max(3600, ...week.map((w) => w.sec));
    week.forEach((w) => {
      const col = el("div", "col" + (w.key === today ? " today" : ""));
      const bar = el("div", "b" + (w.sec >= STREAK_MIN ? " on" : ""));
      bar.style.height = Math.max(2, Math.round((w.sec / scale) * 48)) + "px";
      col.title = w.key + " · " + fmtDur(w.sec);
      col.append(bar, el("div", "d", w.name));
      chart.appendChild(col);
    });
    statsEl.appendChild(chart);

    // Haftalık hedef (pazartesiden bugüne)
    if (pomo.goalH || pomo.goalV) {
      const now = new Date();
      const off = (now.getDay() + 6) % 7;
      let sec = 0;
      for (let k = 0; k <= off; k++) {
        sec += state.time[dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - off + k))] || 0;
      }
      const startMs = new Date(now.getFullYear(), now.getMonth(), now.getDate() - off).getTime();
      let vids = 0;
      courses.forEach((c, i) => Object.values(state.done[pidOf(i)] || {}).forEach((ts) => {

      const box = el("div", "span");
      const h = el("h3");
      h.append(el("span", null, "Bu haftaki hedef"), el("span"));
      box.appendChild(h);
      const row = (label, text, frac) => {
        const r = el("div", "gr");
        const mini = el("div", "mini");
        const fill = document.createElement("i");
        fill.style.width = Math.min(100, Math.round(frac * 100)) + "%";
        mini.appendChild(fill);
        r.append(el("span", null, label), mini, el("span", "ct", text));
        box.appendChild(r);
      };
      if (pomo.goalH) row("Süre", (sec / 3600).toFixed(1).replace(".", ",") + " / " + pomo.goalH + " sa", sec / (pomo.goalH * 3600));
      if (pomo.goalV) row("Video", vids + " / " + pomo.goalV, vids / pomo.goalV);
      statsEl.appendChild(box);
    }

    // Tekrar zamanı (3 gün ve 1 hafta sonra)
    const due = dueReviews();
    if (due.length) {
      const box = el("div", "span");
      const h = el("h3");
      h.append(el("span", null, "Tekrar zamanı"), el("span", null, due.length + " video"));
      box.appendChild(h);
      due.slice(0, 6).forEach((r) => {
        const row = el("div", "rv go");
        const t = el("span", "rvt", courses[r.i].name + " · " + titleOf(r.key, r.id));
        t.title = "Videoya git";
        t.addEventListener("click", () => openVideo(r.key, r.id));
        const ok = el("span", "rvk", "✓");
        ok.title = "Tekrar ettim";
        ok.addEventListener("click", () => markReviewed(r.key, r.id));
        row.append(t, el("span", "rvs", r.st === 0 ? "3. gün" : "1. hafta"), ok);
        box.appendChild(row);
      });
      if (due.length > 6) box.appendChild(el("div", "rv", "+" + (due.length - 6) + " video daha"));
      statsEl.appendChild(box);
    }

    // Alan alan ilerleme
    groupsOf().forEach((g) => {
      const sec = el("div");
      const watched = g.items.reduce((a, i) => a + (state.watch[pidOf(i)] || 0), 0);
      const h = el("h3");
      h.append(el("span", null, g.name), el("span", null, watched ? fmtDur(watched) : ""));
      sec.appendChild(h);
      g.items.forEach((i) => {
        const n = cnt(state.done, i), u = cnt(state.applied, i);
        const total = totalOf(i);
        const row = el("div", "cr");
        const mini = el("div", "mini");
        const fill = document.createElement("i");
        fill.style.width = total ? Math.min(100, Math.round((n / total) * 100)) + "%" : "0%";
        mini.appendChild(fill);
        row.append(el("span", null, courses[i].name), mini, el("span", "ct", total ? n + "/" + total : (n ? String(n) : "–")), el("span", "ap", u ? "◆" + u : ""));
        sec.appendChild(row);
      });
      statsEl.appendChild(sec);
    });

    // Tahmini bitiş: son 4 haftadaki hızına göre
    const fc = forecast();
    if (fc.length) {
      const box = el("div", "span");
      const h = el("h3");
      h.append(el("span", null, "Tahmini bitiş (son 4 haftadaki hızınla)"), el("span"));
      box.appendChild(h);
      fc.forEach((f) => {
        const row = el("div", "rv");
        row.append(el("span", "rvt", courses[f.i].name), el("span", "rvs", "~" + f.weeks + " hafta · haftada " + f.perWeek.toFixed(1).replace(".", ",") + " video"));
        box.appendChild(row);
      });
      statsEl.appendChild(box);
    }

    // Son oturumlar
    const logs = state.log.filter((e) => e.intent || e.learned).slice(-5).reverse();
    if (logs.length) {
      const box = el("div", "span");
      const h = el("h3");
      h.append(el("span", null, "Son oturumlar"), el("span"));
      box.appendChild(h);
      logs.forEach((e) => {
        const d = new Date(e.ts);
        const when = DAYS[d.getDay()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        const ci = courses.findIndex((c, i) => pidOf(i) === e.pid);
        const text = (e.intent ? e.intent : "") + (e.intent && e.learned ? "  →  " : "") + (e.learned || "");
        const row = el("div", "rv");
        const t = el("span", "rvt", text);
        t.title = text;
        row.append(el("span", "rvs", when + (ci >= 0 ? " · " + courses[ci].name : "")), t);
        box.appendChild(row);
      });
      statsEl.appendChild(box);
    }
  }
  function openStats() { closePanels(); renderStats(); statsEl.hidden = false; statsBtn.classList.add("active"); updatePeek(); }
  function closeStats() { statsEl.hidden = true; statsBtn.classList.remove("active"); updatePeek(); }
  function toggleStats() { if (statsEl.hidden) openStats(); else closeStats(); }
  statsBtn.addEventListener("click", toggleStats);

  // ── Uyguladım, notlar, tekrar, planlama, arama, oturum ──
  const DAY = 86400000;
  const isStamp = (v) => typeof v === "number" && v > 1e12;
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const z = (n) => String(n).padStart(2, "0");
    return h ? h + ":" + z(m) + ":" + z(s) : m + ":" + z(s);
  }
  function titleOf(key, id) {
    if (titles[id]) return titles[id];
    const k = (lists[key] || []).indexOf(id);
    return k >= 0 ? "Video " + (k + 1) : "Video";
  }
  function flash(msg) {
    note(msg);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { if (noteEl.textContent === msg) note(""); }, 4000);
  }

  // Uyguladım: videodakini gerçekten kurup çalıştırdın mı
  function setApplied(id, value) {
    const a = state.applied[pid()] || (state.applied[pid()] = {});
    if (!!a[id] === value) return;
    if (value) a[id] = Date.now();
    else { delete a[id]; state.del["a|" + pid() + "|" + id] = Date.now(); }
    saveState();
    highlight();
    refreshPanels();
  }
  function toggleApplied(id) { setApplied(id, !(state.applied[pid()] || {})[id]); }

  // Aralıklı tekrar: bitirdikten 3 gün ve 7 gün sonra
  function dueReviews() {
    const out = [], now = Date.now();
    courses.forEach((c, i) => {
      const key = pidOf(i), d = state.done[key] || {};
      Object.keys(d).forEach((id) => {
        if (!isStamp(d[id])) return;                  // eski kayıtlarda tarih yok
        const st = (state.reviews[key] || {})[id] || 0;
        if (st >= 2) return;
        const dueAt = d[id] + (st === 0 ? 3 : 7) * DAY;
        if (now >= dueAt) out.push({ i, key, id, st, dueAt });
      });
    });
    return out.sort((a, b) => a.dueAt - b.dueAt);
  }
  function markReviewed(key, id) {
    const r = state.reviews[key] || (state.reviews[key] = {});
    r[id] = (r[id] || 0) + 1;
    saveState();
    paintStatsBtn();
    refreshPanels();
  }
  function paintStatsBtn() {
    const n = dueReviews().length;
    statsBtn.textContent = n ? "İlerleme ·" + n : "İlerleme";
  }

  // Tahmini bitiş: son 4 haftada en az 2 video bitirdiysen
  function forecast() {
    const out = [], now = Date.now();
    courses.forEach((c, i) => {
      const total = totalOf(i);
      if (!total) return;
      const d = state.done[pidOf(i)] || {};
      const left = total - Object.keys(d).length;
      const recent = Object.values(d).filter((ts) => isStamp(ts) && now - ts <= 28 * DAY).length;
      if (left <= 0 || recent < 2) return;
      const perWeek = recent / 4;
      out.push({ i, left, perWeek, weeks: Math.max(1, Math.ceil(left / perWeek)) });
    });
    return out;
  }

  // Başka bir kursun belirli videosuna git
  function openVideo(key, id) {
    const i = courses.findIndex((c, k) => pidOf(k) === key);
    if (i < 0) return;
    const k = (lists[key] || []).indexOf(id);
    closePanels();
    if (i === cur) {
      if (ready && verified && k >= 0) { engaged = true; yt.playVideoAt(k); }
      return;
    }
    state.progress[key] = { index: Math.max(0, k), id, time: 0 };
    saveState();
    selectCourse(i);
  }

  // Devam: bu kurstaki bitmemiş ilk videoya git
  function continueCourse() {
    if (!ready || !verified || mode !== "work") return;
    engaged = true;
    const done = doneOf(pid());
    const k = ids.findIndex((id) => !done[id]);
    if (k < 0) { flash("Bu kursta bitmemiş video kalmadı."); return; }
    const p = state.progress[pid()];
    const t = p && p.id === ids[k] ? (p.time || 0) : 0;
    try {
      if (k === idx) { if (t > 0) yt.seekTo(t, true); yt.playVideo(); }
      else { pendingSeek = t; yt.playVideoAt(k); }
    } catch (_) {}
  }

  // Zaman damgalı notlar
  let noteCtx = null;
  function openNotes() {
    if (!ready || !verified || !ids[idx]) { flash("Not almak için videonun yüklenmesini bekle."); return; }
    closePanels();
    let t = 0, playing = false;
    try {
      t = yt.getCurrentTime() || 0;
      playing = yt.getPlayerState() === 1;
    } catch (_) {}
    // Video açılırken durmaz; yazmaya başlayınca durur (bkz. renderNotes). t: notun düşüldüğü an.
    noteCtx = { id: ids[idx], t: Math.floor(t), playing, paused: false };
    renderNotes();
    notesEl.hidden = false;
    notesBtn.classList.add("active");
    updatePeek();
    const inp = notesEl.querySelector("input");
    if (inp) inp.focus();
  }
  function closeNotes() {
    if (notesEl.hidden) return;
    notesEl.hidden = true;
    notesBtn.classList.remove("active");
    const c = noteCtx;
    noteCtx = null;
    if (c && c.paused && ready && mode === "work") { try { yt.playVideo(); } catch (_) {} }
    updatePeek();
  }
  function toggleNotes() { if (notesEl.hidden) openNotes(); else closeNotes(); }

  function renderNotes() {
    notesEl.textContent = "";
    const id = noteCtx.id, key = pid();
    const list = (state.notes[key] || {})[id] || [];
    const h = el("h3");
    h.append(el("span", null, "Not · " + titleOf(key, id)), el("span", null, fmtClock(noteCtx.t)));
    notesEl.appendChild(h);

    const inp = document.createElement("input");
    inp.type = "text";
    inp.className = "ni";
    inp.maxLength = 300;
    inp.autocomplete = "off";
    inp.spellcheck = false;
    inp.placeholder = fmtClock(noteCtx.t) + (noteCtx.playing ? " anına not yaz · Enter: kaydet ve devam et" : " anına not yaz, Enter ile kaydet");
    inp.addEventListener("input", () => {
      // Akış modu: video oynuyorsa yazmaya başlayınca dur
      if (noteCtx && noteCtx.playing && !noteCtx.paused && inp.value) {
        try { yt.pauseVideo(); noteCtx.paused = true; } catch (_) {}
      }
    });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const text = inp.value.trim();
        if (!text) return;
        const byVideo = state.notes[key] || (state.notes[key] = {});
        const arr = byVideo[id] || (byVideo[id] = []);
        arr.push({ t: noteCtx.t, text, at: Date.now() });
        arr.sort((a, b) => a.t - b.t);
        saveState();
        highlight();
        if (noteCtx.paused) {          // akış modu: kaydet, paneli kapat, videoyu devam ettir
          flash("Not kaydedildi · " + fmtClock(noteCtx.t));
          closeNotes();
          return;
        }
        renderNotes();
        const again = notesEl.querySelector("input");
        if (again) again.focus();
      } else if (e.key === "Escape") {
        closeNotes();
      }
    });
    notesEl.appendChild(inp);

    list.forEach((n, j) => {
      const row = el("div", "nr");
      const ck = el("span", "ck", fmtClock(n.t));
      ck.title = "Bu ana git";
      ck.addEventListener("click", () => { try { yt.seekTo(n.t, true); } catch (_) {} });
      const x = el("span", "x", "×");
      x.title = "Notu sil";
      x.addEventListener("click", () => {
        state.del["n|" + key + "|" + id + "|" + n.at] = Date.now();
        list.splice(j, 1);
        if (!list.length) delete state.notes[key][id];
        saveState();
        highlight();
        renderNotes();
      });
      row.append(ck, el("span", null, n.text), x);
      notesEl.appendChild(row);
    });

    const act = el("div", "act", "Bu kursun notlarını dışa aktar (.md)");
    act.addEventListener("click", exportNotes);
    notesEl.appendChild(act);
  }

  function exportNotes() {
    const key = pid(), byVideo = state.notes[key] || {};
    const l = lists[key] || [];
    const order = l.filter((id) => (byVideo[id] || []).length);
    if (!order.length) { flash("Bu kursta henüz not yok."); return; }
    let md = "# " + courses[cur].name + " – Notlar\n";
    order.forEach((id) => {
      md += "\n## " + (l.indexOf(id) + 1) + ". " + titleOf(key, id) + "\n";
      byVideo[id].forEach((n) => { md += "- [" + fmtClock(n.t) + "] " + n.text + "\n"; });
    });
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
      a.download = "odak-notlar-" + courses[cur].name.replace(/[^\wığüşöçİĞÜŞÖÇ-]+/g, "-") + ".md";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (_) {}
    let copy;
    try { copy = navigator.clipboard.writeText(md); } catch (_) { copy = null; }
    if (copy && copy.then) copy.then(() => flash("Notlar panoya kopyalandı ve .md olarak indirildi.")).catch(() => flash("Notlar .md olarak indirildi."));
    else flash("Notlar .md olarak indirildi.");
  }

  // Tam ekran soru kutusu (tur başı niyeti için)
  let askCb = null;
  function openAsk(label, placeholder, ok, skip) {
    askLbl.textContent = label;
    askIn.value = "";
    askIn.placeholder = placeholder;
    askCb = { ok, skip };
    askEl.hidden = false;
    askIn.focus();
  }
  function closeAsk() { askEl.hidden = true; askCb = null; askIn.blur(); }
  askIn.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const v = askIn.value.trim(), cb = askCb; closeAsk(); if (cb) cb.ok(v); }
    else if (e.key === "Escape") { const cb = askCb; closeAsk(); if (cb) cb.skip(); }
  });
  askSkip.addEventListener("click", () => { const cb = askCb; closeAsk(); if (cb) cb.skip(); });

  // Tur başında niyet, tur sonunda "ne öğrendim"
  let currentIntent = "";
  function askIntent(go) {
    const fresh = mode === "work" && !running && remain === dur("work");
    if (!pomo.intent || !fresh) { go(); return; }
    openAsk("Bu turda ne yapacaksın?", "örn. Ders 12: PWM çıkışı, devreyi kur", (v) => { currentIntent = v; go(); }, () => { currentIntent = ""; go(); });
  }
  let pendingReflect = null;
  function showReflect(entry) {
    pendingReflect = entry;
    reflectIn.value = "";
    reflectIn.placeholder = "Bu turda ne öğrendin? Tek cümle, Enter";
    reflectIn.hidden = false;
    setTimeout(() => { if (pendingReflect === entry) reflectIn.focus(); }, 100);
  }
  function hideReflect() { pendingReflect = null; reflectIn.hidden = true; reflectIn.blur(); }
  reflectIn.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const v = reflectIn.value.trim();
      if (pendingReflect && v) { pendingReflect.learned = v; saveState(); refreshPanels(); }
      hideReflect();
    } else if (e.key === "Escape") hideReflect();
  });

  // Oturumu başlat: niyet sor, sade moda geç, pomodoroyu ve videoyu başlat
  function sessionStart() {
    audioInit();
    alarmStop();
    askNotify();
    const zen = () => { if (!document.body.classList.contains("zen")) toggleZen(); };
    if (running) { zen(); return; }
    askIntent(() => { zen(); pomoStart(); });
  }

  // Arama ve süzgeç
  qIn.addEventListener("input", applyFilter);
  qIn.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { qIn.value = ""; applyFilter(); qIn.blur(); }
  });
  undoneBtn.addEventListener("click", () => {
    filterUndone = !filterUndone;
    undoneBtn.classList.toggle("on", filterUndone);
    applyFilter();
  });
  function focusSearch() {
    if (document.body.classList.contains("zen")) return;
    if (!state.list) toggleList();
    qIn.focus();
    qIn.select();
  }
  resumeBtn.addEventListener("click", continueCourse);
  notesBtn.addEventListener("click", toggleNotes);

  // ── Liste ve ilerleme ──
  function startPoll() {
    if (pollingGen === gen) return;
    pollingGen = gen;
    pollList(gen, 0);
  }

  // Her kurs için oynatıcı sıfırdan kurulduğundan, ondan okunan liste kesinlikle o kursun listesidir.
  function pollList(myGen, tries) {
    if (myGen !== gen || !ready || verified) return;
    let l = null;
    try { l = yt.getPlaylist(); } catch (_) {}
    if (l && l.length) {
      const me = pid();
      const changed = l.join() !== ids.join();
      ids = l;
      verified = true;
      lists[me] = l;
      write(LISTS, lists);
      listEl.classList.remove("loading");
      if (changed) renderList();
      resumeIfNeeded();
      syncIndex();
      fetchTitles(myGen);
      refreshPanels();
      return;
    }
    if (tries < 40) setTimeout(() => pollList(myGen, tries + 1), 400);
    else {
      pollingGen = -1;     // vazgeçti; bir sonraki oynatıcı olayı yeniden dener
      note("Liste yüklenemedi. Oynatma listesi gizli ya da silinmiş olabilir; başka bir kurs seç ya da sayfayı yenile.");
    }
  }

  function syncIndex() {
    if (!ready || !verified) return;
    let i = -1;
    try { i = yt.getPlaylistIndex(); } catch (_) {}
    if (i >= 0) idx = i;
    const d = yt.getVideoData();
    if (d && d.video_id && d.title && ids[idx] === d.video_id && titles[d.video_id] !== d.title) {
      titles[d.video_id] = d.title;
      setItemTitle(d.video_id, d.title);
    }
    highlight();
  }

  function saveProgress() {
    if (!ready || !verified || !ids.length) return;
    if (!engaged) return;       // yalnızca açılmış/duran oynatıcının eski konumu diğer cihazdaki yeni kaydı ezmesin
    if (Date.now() < holdSave) return;
    let i = -1, l = null, t = 0, d = 0;
    try { i = yt.getPlaylistIndex(); l = yt.getPlaylist(); t = yt.getCurrentTime() || 0; d = yt.getDuration() || 0; }
    catch (_) { return; }
    // Oynatıcı hâlâ bu kursun listesini taşımıyorsa kaydetme (geçiş anında yanlış kayıt olmasın)
    if (!(i >= 0) || !l || l.join() !== ids.join()) return;
    // Video neredeyse bitmişse bir sonrakinden devam et
    if (d > 30 && t / d >= 0.97 && i + 1 < ids.length) { i++; t = 0; }
    const prev = state.progress[pid()];
    if (prev && prev.index === i && prev.id === ids[i] && Math.abs((prev.time || 0) - Math.floor(t)) < 1) return;   // değişmediyse damga atma
    const at = Date.now();
    state.progress[pid()] = { index: i, id: ids[i], time: Math.floor(t), at: at };
    state.lastId = pid();
    state.lastAt = at;
    saveState();
  }

  // Başlıkları arka planda çek; erişilemezse sadece izlenen videoların başlığı görünür.
  async function fetchTitles(myGen) {
    const todo = ids.filter((id) => !titles[id]);
    let stop = false;
    async function worker() {
      while (todo.length && !stop && myGen === gen) {
        const id = todo.shift();
        try {
          const r = await fetch("https://www.youtube.com/oembed?format=json&url=" +
            encodeURIComponent("https://www.youtube.com/watch?v=" + id));
          if (!r.ok) continue;
          const j = await r.json();
          titles[id] = j.title;
          setItemTitle(id, j.title);
        } catch (_) { stop = true; }
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    write(TITLES, titles);
  }

  // ── Kurs değiştirme ──
  // 1) showCourse: arayüzü ve önbellekteki listeyi anında değiştirir.
  // 2) loadCourse: kısa bir beklemeden sonra oynatıcıya yükler (hızlı tıklamalarda sadece sonuncusu yüklenir).
  function showCourse(i, stamp) {
    cur = i;
    gen++;
    verified = false;
    pollingGen = -1;
    lastRead = "";
    errStreak = 0;
    note("");
    if (stamp) { state.lastId = pid(); state.lastAt = Date.now(); saveState(); }   // açılışta damga atılmaz; diğer cihazın "son kurs"u ezilmesin
    ids = lists[pid()] || [];
    idx = startIndex(i);
    qIn.value = "";
    listEl.classList.add("loading");
    renderList();
    closeMenu();
    paintCourses();
    paintSpeed();
  }

  function needsResume(i) {
    const p = progressOf(i);
    return startIndex(i) > 0 || (p.time || 0) > 0;
  }

  // Oynatıcıyı bu kurs için sıfırdan kurar: eski iframe silinir, yenisi kursun adresiyle açılır.
  // Böylece ekrandaki video ve liste her zaman seçili kursla aynı olur.
  function mountPlayer(play) {
    if (!window.YT || !YT.Player) return;
    const token = ++playerToken;
    ready = false;
    verified = false;
    engaged = false;
    pollingGen = -1;
    try { if (yt && yt.destroy) yt.destroy(); } catch (_) {}
    yt = null;
    const old = $("yt");
    if (old) old.remove();
    mountedPlay = !!play && mode === "work";
    const f = document.createElement("iframe");
    f.id = "yt";
    f.title = "Kurs oynatıcı";
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    // Kaldığın yerden devam edilecekse kendiliğinden oynatma; önce doğru videoya gidilir
    f.src = embedSrc(pid()) + (mountedPlay && !needsResume(cur) ? "&autoplay=1" : "");
    document.querySelector(".player").insertBefore(f, $("rest"));
    yt = new YT.Player(f, { events: {
      onReady: () => { if (token === playerToken) onReady(); },
      onStateChange: (e) => { if (token === playerToken) onStateChange(e); },
      onError: (e) => { if (token === playerToken) onError(e); }
    } });
  }

  // Liste yüklenince kaldığın videoya ve saniyeye git
  function resumeIfNeeded() {
    if (!needsResume(cur)) return;
    const p = progressOf(cur);
    const opts = { listType: "playlist", list: pid(), index: startIndex(cur), startSeconds: p.time || 0 };
    holdSave = Date.now() + 4000;
    try { if (mountedPlay) yt.loadPlaylist(opts); else yt.cuePlaylist(opts); } catch (_) {}
  }

  function selectCourse(i) {
    if (i === cur) { closeMenu(); return; }
    saveProgress();
    showCourse(i, true);
    clearTimeout(switchTimer);
    switchTimer = setTimeout(() => mountPlayer(true), 250);
  }

  // ── Kontroller ──
  function prev() { if (ready && verified && mode === "work") { engaged = true; yt.previousVideo(); } }
  function next() { if (ready && verified && mode === "work") { engaged = true; yt.nextVideo(); } }
  function toggleList() { state.list = !state.list; saveState(); paintList(); highlight(true); }
  function toggleZen() {
    document.body.classList.toggle("zen");
    zenBtn.classList.toggle("active", document.body.classList.contains("zen"));
    barEl.classList.remove("touch");
    updateHot();
    closePanels();
    paintList();                         // liste ayarına göre yeniden göster
    renderList();                        // içeriği baştan çiz (gizliyken boş kalmasın)
    if (ready && !verified) startPoll();
  }
  function cycleSpeed() {
    const next = RATES[(RATES.indexOf(rateOf()) + 1) % RATES.length];
    state.rates[pid()] = next;           // hız her kurs için ayrı hatırlanır
    state.prefsAt = Date.now();
    saveState();
    paintSpeed();
    if (ready) { try { yt.setPlaybackRate(next); } catch (_) {} }
  }

  $("prev").addEventListener("click", prev);
  $("next").addEventListener("click", next);
  speedBtn.addEventListener("click", cycleSpeed);
  listBtn.addEventListener("click", toggleList);

  // Klavye kısayolları (odak videonun dışındayken):
  // N sonraki, P önceki, L liste, K kurslar, I ilerleme, F sade mod, S hız,
  // D bitti, U uyguladım, M not, R devam, B oturumu başlat, T pomodoro, / ara
  addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;      // yazarken kısayollar çalışmasın
    if (!askEl.hidden) return;
    const k = e.key.toLowerCase();
    if (k === "n") next();
    else if (k === "p") prev();
    else if (k === "l") toggleList();
    else if (k === "k") toggleMenu();
    else if (k === "i") toggleStats();
    else if (k === "f") toggleZen();
    else if (k === "s") cycleSpeed();
    else if (k === "d") { const id = ids[idx]; if (id && verified) toggleDone(id); }
    else if (k === "u") { const id = ids[idx]; if (id && verified) toggleApplied(id); }
    else if (k === "m") { e.preventDefault(); toggleNotes(); }
    else if (k === "r") continueCourse();
    else if (k === "b") sessionStart();
    else if (k === "t") pomoToggle();
    else if (k === "/") { e.preventDefault(); focusSearch(); }
    else if (k === "escape") {
      if (!menuEl.hidden || !statsEl.hidden || !notesEl.hidden || !pop.hidden) closePanels();
      else if (document.body.classList.contains("zen")) toggleZen();
    }
  });

  // ── YouTube IFrame API ──

  function onStateChange(e) {

      pendingSeek = 0;

    if (s === 0) {

  // 100: silinmiş/gizli, 101-150: gömülmesine izin yok, 153: yönlendiren bilgisi yok, 2/5: geçersiz istek / oynatıcı hatası
  function onError(e) {
    const c = e.data;

      note("YouTube Hata 153: sayfa dosya olarak değil, baslat.bat sunucusu üzerinden (http://…) açılmalı.");

  // Her 5 sn: ilerleme kaydı, izleme süresi, otomatik "bitti"

  function persistNow() { saveProgress(); flushRemote(); }

  addEventListener("pageshow", (e) => { if (e.persisted) syncNow(); });
